<div class="container request-dialog">
  <!-- header section -->
  <div class="dialog-header">
    <div class="d-flex justify-content-start justify-content-md-between">
      <h3 mat-dialog-title>List Of Requested Vendors</h3>
      <button mat-icon-button (click)="closeDialog()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <mat-divider class="my-3"></mat-divider>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Search users...</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput placeholder="Input" [formControl]="searchControl" />
      <button
        *ngIf="searchControl.value"
        mat-icon-button
        matSuffix
        type="button"
        (click)="searchControl.setValue('')"
      >
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <app-generic-table
      [data]="requestList"
      [columns]="columns"
      [showIndex]="false"
      [actions]="actions"
      (actionClick)="onActionClick($event)"
      (rowClick)="onRowClick($event)"
      (loadMore)="loadMoreData()"
    >
    </app-generic-table>
  </div>
</div>
