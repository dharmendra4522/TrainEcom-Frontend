<div
  class="container-fluid min-vh-100"
  *ngIf="userProfileData; else loadingTemplate"
>
  <!-- Edit Mode -->
  <app-vendor-profile-edit
    *ngIf="isEditMode"
    [userProfileData]="userProfileData"
    [vendorData]="vendorData"
    (onEditModeToggle)="isEditMode = $event"
  >
  </app-vendor-profile-edit>

  <!-- View Mode -->
  <div
    *ngIf="!isEditMode"
    class="card shadow-sm border-0 rounded-4 p-4 bg-white"
  >
    <!-- Header -->
    <div
      class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3 gap-2 flex-wrap"
    >
      <h2 class="fw-bold text-dark m-0">Profile</h2>
      <button
        mat-flat-button
        color="primary"
        *ngIf="isApprovedVendor"
        (click)="toggleEditMode()"
      >
        <mat-icon>edit</mat-icon>
        Edit Mode
      </button>
    </div>
    <mat-tab-group animationDuration="300ms">
      <!-- General -->
      <mat-tab *ngFor="let tab of tabs" [label]="tab.label">
        <div class="p-4">
          <div class="row gx-4 gy-3">
            <div
              class="col-md-6 d-flex flex-column"
              *ngFor="let field of tab.fields"
            >
              <span class="text-secondary small fw-semibold mb-1">
                {{ field.label }}
              </span>

              <ng-container *ngIf="field.isLink; else normalField">
                <div class="p-3 bg-light rounded border">
                  <a
                    *ngIf="field.docType && documentUrlMap[field.docType]"
                    [href]="documentUrlMap[field.docType]"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    View Document
                  </a>
                  <span
                    *ngIf="field.docType && !documentUrlMap[field.docType]"
                    class="text-muted"
                  >
                    Not provided
                  </span>
                </div>
              </ng-container>

              <ng-template #normalField>
                <ng-container *ngIf="field.isList; else normalValue">
                  <div class="p-3 bg-light rounded border">
                    <span
                      *ngFor="let cat of vendorCategories"
                      class="badge bg-light text-dark border px-3 py-2 me-2"
                    >
                      {{ cat }}
                    </span>
                  </div>
                </ng-container>
                <ng-template #normalValue>
                  <div class="p-3 bg-light rounded border text-dark fs-6">
                    {{ fieldValues[field.key] || "N/A" }}
                  </div>
                </ng-template>
              </ng-template>
              <mat-hint *ngIf="field.reviewHint && isApprovedVendor" class="hint-text">{{
                field.reviewHint
              }}</mat-hint>
            </div>
          </div>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>

<ng-template #loadingTemplate>
  <div class="container text-center py-5">
    <mat-spinner diameter="40" class="mx-auto"></mat-spinner>
    <p class="text-secondary mt-2">Loading vendor profile details...</p>
  </div>
</ng-template>
