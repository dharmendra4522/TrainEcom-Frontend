<div class="container-fluid mt-2 px-0">
  <div class="sticky-top-section">
    <div
      class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2"
    >
      <div>
        <h2 class="fs-4 fw-bold text-dark m-0">Vendor Management</h2>
        <p class="text-muted small m-0">
          View and manage all registered Vendors.
        </p>
      </div>
    </div>

    <!-- Filter section -->
    <div class="row g-3 mb-4 align-items-center" [formGroup]="filterForm">
      <!-- Search Input -->
      <div class="col-12 col-md-5">
        <mat-form-field
          appearance="outline"
          class="w-100 mb-0"
          subscriptSizing="dynamic"
        >
          <mat-label>Search Vendors</mat-label>
          <mat-icon matPrefix class="text-secondary">search</mat-icon>
          <input
            matInput
            formControlName="search"
            placeholder="Search by name or email..."
          />
        </mat-form-field>
      </div>

      <!-- Filter by Status -->
      <div class="col-12 col-md-5">
        <mat-form-field
          appearance="outline"
          class="w-100 mb-0"
          subscriptSizing="dynamic"
        >
          <mat-label>Filter by Status</mat-label>
          <mat-select
            formControlName="status"
          >
            <mat-option value="All">All Status</mat-option>
            <mat-option *ngFor="let status of statusOptions" [value]="status">
              {{ status }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div
        class="col-12 col-md-2 d-flex align-items-center"
        *ngIf="searchQuery || (selectedStatus && selectedStatus !== 'All')"
      >
        <button
          mat-stroked-button
          color="warn"
          class="w-100 d-flex align-items-center justify-content-center gap-1 rounded-3"
          style="height: 48px"
          (click)="resetFilter()"
          title="Reset Filters"
        >
          <mat-icon>clear</mat-icon> Reset
        </button>
      </div>
    </div>
  </div>

  <!-- Users Table -->
  <app-generic-table
    [data]="vendors"
    [columns]="columns"
    [actions]="actions"
    [isLoading]="isLoading"
    [showPaginator]="true"
    [showInlineActions]="true"
    [totalRecords]="totalRecords"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[5, 10, 20]"
    (pageChange)="onPageChange($event)"
    (actionClick)="onActionClick($event)"
    emptyMessage="No vendors found."
  >
  </app-generic-table>
</div>
