<div class="container-fluid px-0">
  <!-- Users Table -->
  <app-generic-table
    [data]="allUsers"
    [columns]="columns"
    [actions]="actions"
    [isLoading]="isLoading"
    [showIndex]="false"
    [showPaginator]="false"
    [showInlineActions]="false"
    [totalRecords]="totalRecords"
    (loadMore)="onTableScroll()"
    (actionClick)="onActionClick($event)"
    emptyMessage="Users will appear here once the API is connected."
    [showheaderFilter]="showHeaderFilter"
    (filterChanged)="onHeaderFilterChange($event)"
    [dropdownOptionsMap]="dropdownOptionsMap"
    [selectedFiltersMap]="selectedFiltersMap"
    (dropdownSelectionChange)="onDropdownSelectionChange($event)"
    (filterApply)="onFilterApply($event)"
    (filterClear)="onFilterClear($event)"
  ></app-generic-table>
</div>
