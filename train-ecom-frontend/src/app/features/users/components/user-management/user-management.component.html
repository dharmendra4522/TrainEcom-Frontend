<div class="container-fluid mt-2 px-0">
  <div class="sticky-top-section">
    <div
      class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2"
    >
      <div>
        <h2 class="fs-4 fw-bold text-dark m-0">
          {{ activeTab === "users" ? "User Management" : "Vendor Management" }}
        </h2>
        <p class="text-muted small m-0">
          {{
            activeTab === "users"
              ? "View and manage all registered users."
              : "View and manage all registered vendors."
          }}
        </p>
      </div>
    </div>

    <!-- new navigation tab -->
    <mat-tab-group (selectedTabChange)="onTabChange($event)" class="mb-4">
      <mat-tab *ngFor="let tab of tabs" [label]="tab.label">
      </mat-tab>
    </mat-tab-group>

  </div>

  <div class="tab-content-area">
    <app-all-users *ngIf="activeTab === 'users'"></app-all-users>
    <app-vendor-management *ngIf="activeTab === 'vendors'"></app-vendor-management>
  </div>
</div>
