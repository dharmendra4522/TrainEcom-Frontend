<div class="container-fluid mt-2 px-0 user-management-container">
  <div class="sticky-top-section bg-white pb-2">
    <!-- Header -->
    <div class="row align-items-center justify-content-between mb-3 g-3 p-2">
      <div class="col-12 col-md-5">
        <h2 class="fs-4 fw-bold text-dark m-0">{{(userRole$ | async) === role.Vendor ? 'Staff Management' : 'User Management'}}</h2>
        <p class="text-muted small m-0">{{(userRole$ | async) === role.Vendor ? 'View and manage all staff users.' : 'View and manage all users.'}}</p>
      </div>

      <!-- Search input section in header -->
      <div class="col-12" [ngClass]="(userRole$ | async) === role.Vendor ? 'col-md-5' : 'col-md-4'">
        <mat-form-field
          appearance="outline"
          class="user-search-field w-100 mb-0 pb-0"
          subscriptSizing="dynamic"
          floatLabel="always"
        >
          <mat-label>Search users...</mat-label>
          <mat-icon matPrefix class="text-secondary">search</mat-icon>
          <input
            matInput
            placeholder="Type to search..."
            [formControl]="globalSearch"
          />
          <button
            *ngIf="globalSearch.value"
            mat-icon-button
            matSuffix
            type="button"
            aria-label="Clear search"
            title="Clear search"
            (click)="clearAllFilters()"
          >
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </div>
      <ng-container *ngIf="(userRole$ | async) === role.Vendor">
        <div class="col-12 col-md-2 text-md-end">
          <button mat-raised-button color="primary" class="w-100 w-md-auto custom-add-button" (click)="onAddStaf()">
            <mat-icon>add</mat-icon>
            Add Staf Users
          </button>
        </div>
      </ng-container>
    </div>

    <!-- new navigation tab -->
    <ng-container *ngIf="(userRole$ | async) === role.Admin">
      <mat-tab-group
        [selectedIndex]="selectedindex"
        (selectedTabChange)="onTabChange($event)"
        class=""
      >
        <mat-tab *ngFor="let tab of tabs" [label]="tab.label"> </mat-tab>
      </mat-tab-group>
    </ng-container>
  </div>

  <!-- Content area -->
  <div class="tab-content-area row">
    <div class="col-12" *ngIf="(userRole$ | async) === role.Admin">
      <app-all-users
        *ngIf="activeTab === 'customers'"
        [externalSearchQuery]="searchQueryText"
        (searchReset)="globalSearch.setValue('')"
      ></app-all-users>
      <app-vendor-management
        *ngIf="activeTab === 'vendors'"
        [externalSearchQuery]="searchQueryText"
        (searchReset)="globalSearch.setValue('')"
      ></app-vendor-management>
    </div>
    <ng-container *ngIf="(userRole$ | async) === role.Vendor">
      <app-all-staff-users [externalSearchQuery]="searchQueryText"
        (searchReset)="globalSearch.setValue('')"
        [refreshSignal]="refreshSignal"
        >
      </app-all-staff-users>
    </ng-container>
  </div>
</div>
