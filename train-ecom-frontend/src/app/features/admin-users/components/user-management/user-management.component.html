<div class="user-management-container py-4 px-2 px-md-4">

  <!-- Page Header -->
  <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
    <div>
      <h4 class="fw-bold text-dark m-0">User Management</h4>
      <p class="text-muted small m-0">View and manage all registered users</p>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="mb-4">
    <mat-form-field appearance="outline" class="w-100 w-md-50">
      <mat-label>Search users</mat-label>
      <mat-icon matPrefix class="me-2 text-secondary">search</mat-icon>
      <input matInput [formControl]="searchControl" placeholder="Search by name, email, or role..." />
      <button mat-icon-button matSuffix *ngIf="searchControl.value" (click)="searchControl.setValue('')">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <!-- Users Table -->
  <app-generic-table
    [data]="filteredUsers"
    [columns]="columns"
    [actions]="actions"
    [isLoading]="isLoading"
    [showPaginator]="true"
    [totalRecords]="totalRecords"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [emptyMessage]="'No users found.'"
    (actionClick)="handleTableAction($event)"
    (pageChange)="handlePageChange($event)">
  </app-generic-table>

</div>
