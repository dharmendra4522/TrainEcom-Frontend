<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <mat-card class="p-5 shadow-sm border-0 rounded-4 bg-white">
                <div class="mb-4 d-flex justify-content-center align-items-center">
                    <img src="assets/Success.svg" alt="Success Animation"
                        style="width: 300px; height: 300px; " />
                </div>

                <h2 class="fw-bold text-dark mb-2">Order Placed Successfully!</h2>
                <p class="text-secondary small mb-4">
                    Thank you for shopping with us. Your order has been successfully placed and is being processed.
                </p>

                <div class="bg-light rounded-3 p-3 mb-4 border" *ngIf="orderId">
                    <span class="text-muted small d-block mb-1">Order ID:</span>
                    <span class="fw-bold font-monospace text-primary text-break">{{ orderId }}</span>
                </div>

                <div class="d-flex gap-3 justify-content-center">
                    <button mat-flat-button color="primary" class="px-4 py-3 rounded-3 fw-bold w-100"
                        (click)="goToHome()">
                        <mat-icon class="me-1">home</mat-icon> Back to Home
                    </button>
                </div>
            </mat-card>
        </div>
    </div>
</div>
