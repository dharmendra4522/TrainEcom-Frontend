<mat-card class="checkout-card mb-4" appearance="outlined">
  <mat-card-header class="mb-3">
    <mat-card-title class="fs-5 fw-bold m-0 d-flex align-items-center gap-2">
      <mat-icon class="text-primary">payment</mat-icon>
      2. Choose Payment Method
    </mat-card-title>
  </mat-card-header>

  <mat-card-content class="pt-2">
    <div class="row g-3">
      <!-- Cash on Delivery Option -->
      <div class="col-md-4">
        <div class="payment-tile rounded-3 p-3 text-center border cursor-pointer transition-all"
          [class.active-payment]="selectedMethod === PaymentMethod.CashOnDelivery"
          (click)="selectMethod(PaymentMethod.CashOnDelivery)">
          <mat-icon class="fs-1 mb-2 text-primary" style="width: 40px; height: 40px;">local_atm</mat-icon>
          <h6 class="fw-bold text-dark m-0">Cash on Delivery</h6>
          <small class="text-secondary d-block mt-1">Pay at your doorstep</small>
        </div>
      </div>

      <!-- UPI Payment Option -->
      <div class="col-md-4">
        <div class="payment-tile rounded-3 p-3 text-center border cursor-pointer transition-all"
          [class.active-payment]="selectedMethod === PaymentMethod.UPI"
          (click)="selectMethod(PaymentMethod.UPI)">
          <mat-icon class="fs-1 mb-2 text-primary" style="width: 40px; height: 40px;">qr_code_2</mat-icon>
          <h6 class="fw-bold text-dark m-0">UPI Payment</h6>
          <small class="text-secondary d-block mt-1">Pay via Google Pay / UPI</small>
        </div>
      </div>

      <!-- Credit / Debit Card Option -->
      <div class="col-md-4">
        <div class="payment-tile rounded-3 p-3 text-center border cursor-pointer transition-all"
          [class.active-payment]="selectedMethod === PaymentMethod.Card"
          (click)="selectMethod(PaymentMethod.Card)">
          <mat-icon class="fs-1 mb-2 text-primary" style="width: 40px; height: 40px;">credit_card</mat-icon>
          <h6 class="fw-bold text-dark m-0">Credit / Debit Card</h6>
          <small class="text-secondary d-block mt-1">Visa, MasterCard, RuPay</small>
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
