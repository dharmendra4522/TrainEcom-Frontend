<div class="home-container">
  <app-hero></app-hero>
 
  <ng-container *ngIf="brands$ | async as brandsList">
    <app-grouped-product-row *ngFor="let brand of brandsList" [title]="brand.name" filterType="brand"
      [filterValue]="brand.name">
    </app-grouped-product-row>

  </ng-container>

  <ng-container *ngIf="categories$ | async as catList">
    <app-grouped-product-row *ngFor="let cat of catList" [title]="cat.name" filterType="category"
      [filterValue]="cat.name">
    </app-grouped-product-row>
  </ng-container>


</div>
