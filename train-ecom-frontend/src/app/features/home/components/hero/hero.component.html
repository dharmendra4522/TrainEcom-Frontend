<div id="homeHeroCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-inner">
        <div *ngFor="let banner of banners; let i = index" class="carousel-item" [class.active]="i === 0">
            <img [src]="banner.imageUrl" class="d-block w-100 object-fit-cover hero-banner-img" alt="Banner {{ i + 1 }}">

            <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded-3 pb-3 px-4 mb-4">
                <h2 class="fw-bold text-white fs-1 mb-0">{{ banner.title }}</h2>
                <p class="fs-5 text-light mb-0">{{ banner.description }}</p>
                <button class="btn btn-primary">{{ banner.ctaText }}</button>
            </div>

        </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#homeHeroCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#homeHeroCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>

</div>
