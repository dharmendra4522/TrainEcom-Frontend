<div class="container-fluid mt-2 px-0">
  <div class="sticky-top-section mb-4">
    <div class="row align-items-center g-3">
      <!-- Title section -->
      <div class="col-12 col-lg-6">
        <h2 class="fs-4 fw-bold text-dark m-0">Category Management</h2>
        <p class="text-muted small m-0">Add, update, and review categories shown in the storefront.</p>
      </div>

      <!-- search section -->
      <div class="col-12 col-lg-5">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-sm">
            <mat-form-field appearance="outline" class="category-search-field w-100 mb-0 pb-0" subscriptSizing="dynamic" floatLabel="always">
              <mat-label>Search categories</mat-label>
              <mat-icon matPrefix class="text-secondary">search</mat-icon>
              <input matInput [formControl]="searchControl" placeholder="Search by category name or description...">
            </mat-form-field>
          </div>

          <div class="col-12 col-sm-auto">
            <button mat-stroked-button color="warn" [disabled]="!searchControl.value"
              class="category-toolbar-button d-flex align-items-center justify-content-center gap-1 rounded-3 px-3 w-100"
              (click)="resetSearch()" title="Reset Search">
              <mat-icon>clear</mat-icon> Reset
            </button>
          </div>
        </div>
      </div>

      <!-- Add button -->
      <div class="col-12 col-lg-1 text-lg-end">
        <button mat-raised-button color="primary" (click)="openCategoryDialog()" class="category-toolbar-button w-100">
          <mat-icon>add</mat-icon> Add
        </button>
      </div>
    </div>
  </div>

  <app-generic-table 
    [data]="(paginatedCategories$ | async) || []" 
    [isLoading]="(isLoading$ | async) || false"
    [columns]="columns" 
    [actions]="actions" 
    [enableRowClick]="false"
    [showInlineActions]="false" 
    [showPaginator]="false"
    [totalRecords]="(totalRecords$ | async) || 0" 
    emptyMessage="No categories found." 
    (actionClick)="handleTableAction($event)"
    (loadMore)="onTableScroll()">
  </app-generic-table>
</div>
