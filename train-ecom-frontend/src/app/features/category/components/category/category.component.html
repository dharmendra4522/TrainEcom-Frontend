<div class="container-fluid mt-2 px-0">
  <div class="sticky-top-section mb-4">
    <div class="row align-items-center g-3">
      <!-- Title section -->
      <div class="col-12 col-lg-6">
        <h2 class="fs-4 fw-bold text-dark m-0">Category Management</h2>
        <p class="text-muted small m-0">
          Add, update, and review categories shown in the storefront.
        </p>
      </div>

      <!-- search section -->
      <div class="col-12 col-lg-5">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-sm">
            <mat-form-field
              appearance="outline"
              class="category-search-field w-100 mb-0 pb-0"
              subscriptSizing="dynamic"
              floatLabel="always"
            >
              <mat-label>{{
                activeTabIndex === 1
                  ? "Search sub-categories"
                  : "Search categories"
              }}</mat-label>
              <mat-icon matPrefix class="text-secondary">search</mat-icon>
              <input
                matInput
                [formControl]="activeSearchControl"
                placeholder="Search..."
              />
              <button
                  matSuffix
                  mat-icon-button
                  aria-label="Clear"
                  *ngIf="activeSearchControl.value"
                  (click)="resetSearch()"
              >
                    <mat-icon>close</mat-icon>
              </button>
            </mat-form-field>
          </div>
        </div>
      </div>

      <!-- Add button -->
      <div class="col-12 col-lg-1 text-lg-end">
        <button
          mat-raised-button
          color="primary"
          (click)="openCategoryDialog()"
          class="category-toolbar-button w-100"
        >
          <mat-icon>add</mat-icon> Add
        </button>
      </div>
    </div>
  </div>

  <mat-tab-group
    class="category-tabs mt-3"
    [selectedIndex]="activeTabIndex"
    (selectedTabChange)="onTabChange($event.index)"
  >
    <mat-tab label="Category">
      <app-parent-category
        [searchControl]="categorySearchControl"
      ></app-parent-category>
    </mat-tab>
    <mat-tab label="Sub-category">
      <app-sub-category
        [searchControl]="subCategorySearchControl"
      ></app-sub-category>
    </mat-tab>
  </mat-tab-group>
</div>
