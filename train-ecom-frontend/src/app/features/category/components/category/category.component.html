<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary m-0">Category Management</h2>
    <button class="btn btn-danger" (click)="openCategoryDialog()">
      <i class="bi bi-plus"></i>
      Add New Category
    </button>
  </div>


  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <table mat-table [dataSource]="categories" class="mat-elevation-z0 w-100">
        <ng-container matColumnDef="sno">
          <th mat-header-cell *matHeaderCellDef>S. No</th>
          <td mat-cell *matCellDef="let category; let i = index">
            {{ i + 1 }}
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Category Name</th>
          <td mat-cell *matCellDef="let category">
            <strong>{{ category.name }}</strong>
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let category">
            {{ category.description }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-end">Actions</th>
          <td mat-cell *matCellDef="let category" class="text-end">
            <button
              mat-icon-button
              color="primary"
              (click)="openCategoryDialog(category)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              (click)="deleteCategory(category.id)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="['sno', 'name', 'description', 'actions']"
        ></tr>
        <tr
          mat-row
          *matRowDef="
            let row;
            columns: ['sno', 'name', 'description', 'actions']
          "
        ></tr>
      </table>

      <div *ngIf="categories.length === 0" class="p-4 text-center text-muted">
        No categories found.
      </div>
    </div>
  </div>
</div>
