<app-generic-table
  [data]="subCategories"
  [isLoading]="isLoading"
  [columns]="columns"
  [actions]="actions"
  [enableRowClick]="false"
  [showInlineActions]="false"
  [showPaginator]="false"
  [totalRecords]="totalRecords"
  emptyMessage="No sub-categories found."
  (actionClick)="handleSubCategoryAction($event)"
  (loadMore)="onTableScroll()"
  [showheaderFilter]="showHeaderFilter"
  (filterChanged)="onTableFilterChanged($event)"
  (filterCleared)="onTableFilterCleared($event)"
>
</app-generic-table>
