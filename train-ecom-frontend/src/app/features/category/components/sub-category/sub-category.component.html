<app-generic-table
  [data]="subCategories"
  [isLoading]="isLoading"
  [columns]="columns"
  [actions]="actions"
  [showIndex]="false"
  [enableRowClick]="false"
  [showInlineActions]="false"
  [showPaginator]="false"
  [totalRecords]="totalRecords"
  emptyMessage="No sub-categories found."
  (actionClick)="handleSubCategoryAction($event)"
  (loadMore)="onTableScroll()"
  [showheaderFilter]="showHeaderFilter"
  [dropdownOptionsMap]="dropdownOptionsMap"
  [selectedFiltersMap]="selectedFiltersMap"
  (filterChanged)="onTableFilterChanged($event)"
  (filterCleared)="onTableFilterCleared($event)"
  (dropdownSearchChange)="onDropdownSearchChanged($event)"
  (dropdownSelectionChange)="onDropdownSelectionChanged($event)"
  (filterApply)="onFilterApply($event)"
  (filterClear)="onFilterClear($event)"
>
</app-generic-table>
