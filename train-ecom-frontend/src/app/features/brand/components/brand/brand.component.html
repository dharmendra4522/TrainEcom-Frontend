<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary m-0">Brand Management</h2>
    <button class="btn btn-danger" (click)="openBrandDialog()">
      <i class="bi bi-plus"></i> Add New Brand
    </button>
  </div>

  <app-generic-table 
    [data]="brands" 
    [columns]="columns" 
    [actions]="actions" 
    emptyMessage="No brands found."
    (actionClick)="handleTableAction($event)">
  </app-generic-table>
</div>
