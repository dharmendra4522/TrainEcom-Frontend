<div class="container-fluid mt-2 px-0">
  <div class="sticky-top-section mb-4">
    <div class="row align-items-start justify-content-between g-3">
      <!-- title section -->
      <div class="col-12 col-lg-6">
        <h2 class="fs-4 fw-bold text-dark m-0">Brand Management</h2>
        <p class="text-muted small m-0">Create, edit, and organize brands used across products.</p>
      </div>

    <!-- search section -->
      <div class="col-12 col-lg-6 d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center justify-content-lg-end gap-2">
        <mat-form-field appearance="outline" class="custom-search-field brand-search-field mb-0 pb-0" subscriptSizing="dynamic" floatLabel="always">
          <mat-label>Search brands</mat-label>
          <mat-icon matPrefix class="text-secondary">search</mat-icon>
          <input matInput [formControl]="searchControl" placeholder="Search...">
          <button
            *ngIf="searchControl.value"
            mat-icon-button
            matSuffix
            type="button"
            color="warn"
            aria-label="Reset brand search"
            title="Reset Search"
            (click)="resetSearch()"
          >
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="openBrandDialog()" class="brand-toolbar-button flex-shrink-0">
          <mat-icon>add</mat-icon> Add
        </button>
      </div>
    </div>

    <div class="mb-4">
      
    </div>
  </div>

<app-generic-table 
    [data]="(paginatedBrands$ | async) || []" 
    [isLoading]="(isLoading$ | async) || false"
    [columns]="columns" 
    [actions]="actions" 
    [enableRowClick]="false"
    [showInlineActions]="false" 
    [showPaginator]="false"
    [totalRecords]="(totalRecords$ | async) || 0" 
    emptyMessage="No brands found." 
    (actionClick)="handleTableAction($event)"
    (loadMore)="onTableScroll()"
    [showheaderFilter]="showHeaderFilter"
    (filterChanged)="onTableFilterChanged($event)"
    (filterCleared)="onTableFilterCleared($event)">
  </app-generic-table>
</div>
