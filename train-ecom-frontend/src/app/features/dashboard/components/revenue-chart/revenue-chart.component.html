<mat-card class="p-3 chart-card w-100">
  <ng-container *ngIf="isLoading; else revenueContentLoaded">
    <div class="spinner-container">
      <mat-spinner diameter="30"></mat-spinner>
    </div>
  </ng-container>
  <ng-template #revenueContentLoaded>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h5 class="card-title m-0 fw-bold">Total Revenue</h5>
        <span
          class="fw-bold fs-5 text-dark revenue-text"
          *ngIf="totalRevenue > 0"
        >
          {{ totalRevenue | currency: "INR" : true }}</span
        >
      </div>
      <button
        mat-stroked-button
        color="primary"
        class="icon-btn"
        [matBadge]="revenueFilterCount"
        [matBadgeHidden]="revenueFilterCount === 0"
        matBadgeOverlap="true"
        (click)="onRevenueFilterDialog()"
      >
        <mat-icon>filter_alt</mat-icon>
      </button>
    </div>
    <div class="bar-chart">
      <canvas
        baseChart
        [data]="revenueChartData"
        [type]="revenueChartType"
        [options]="revenueChartOptions"
      ></canvas>
    </div>
  </ng-template>
</mat-card>
