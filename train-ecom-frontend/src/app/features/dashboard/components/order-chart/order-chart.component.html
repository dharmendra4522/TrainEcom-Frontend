<mat-card class="p-3 chart-card w-100">
  <ng-container *ngIf="isLoading; else orderContentLoaded">
    <div class="spinner-container">
      <mat-spinner diameter="30"></mat-spinner>
    </div>
  </ng-container>
  <ng-template #orderContentLoaded>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h5 class="card-title m-0 fw-bold">Order</h5>
        <span class="fw-bold fs-5 text-dark" *ngIf="totalOrders > 0">
          {{ totalOrders }}</span
        >
      </div>
      <button
        mat-stroked-button
        color="primary"
        class="icon-btn"
        [matBadge]="orderFilterCount"
        [matBadgeHidden]="orderFilterCount === 0"
        matBadgeOverlap="true"
        (click)="onOrderFilterDialog()"
      >
        <mat-icon>filter_alt</mat-icon>
      </button>
    </div>
    <div class="bar-chart">
      <canvas
        baseChart
        [data]="orderChartData"
        [type]="orderChartType"
        [options]="orderChartOptions"
      ></canvas>
    </div>
  </ng-template>
</mat-card>
