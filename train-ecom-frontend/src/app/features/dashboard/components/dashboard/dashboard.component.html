<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fs-4 fw-bold text-dark m-0" *ngIf="isApproved">Dashboard</h2>
</div>

<ng-container *ngIf="isApproved; else pendingMessage">
  <!-- Stats Cards using Metrics Sub-component -->
  <app-metrics
    [stats]="stats"
    [isLoadingStats]="isLoadingStats"
    [totalUsers]="totalUsers"
    [totalCustomers]="totalCustomers"
    [totalVendors]="totalVendors"
    [totalOrders]="totalOrders"
    [activeOrders]="activeOrders"
    [deliveredOrders]="deliveredOrders"
    [cancelOrders]="cancelOrders"
    [portal]="portal"
    (statCardClick)="onStatCardClick($event)"
  ></app-metrics>

  <!-- cart section -->
  <div class="row my-4">
    <!-- user chart -->
    <div class="col-md-3 mb-3">
      <mat-card class="p-3 h-100">
        <h5 class="card-title mb-3">Total Users</h5>
        <span class="fw-bold fs-5 text-dark">{{totalUsers}}</span>
        <div class="bar-chart">
          <canvas
            baseChart
            [data]="userChartData"
            [type]="userChartsType"
            [options]="userChartOptions"
          >
          </canvas>
        </div>
      </mat-card>
    </div>

    <!-- product section -->
    <div class="col-md-3 mb-3">
      <mat-card class="p-3 h-100">
        <h5 class="card-title m-0">Category Based Products</h5>
        <div class="bar-chart">
          <canvas
            baseChart
            [data]="productChartData"
            [type]="productChartType"
            [options]="productChartOptions"
          >
          </canvas>
        </div>
      </mat-card>
    </div>

    <!-- order chart -->
    <div class="col-md-3 mb-3">
      <mat-card class="p-3 h-100">
        <h5 class="card-title m-0">Order Status</h5>
        <div class="bar-chart">
          <canvas
            baseChart
            [data]="orderChartData"
            [type]="orderChartType"
            [options]="orderChartOptions"
          >
          </canvas>
        </div>
      </mat-card>
      </div>
      
      <!-- revenue chart -->
      <div class="col-md-3 mb-3">
        <mat-card class="p-3 h-100">
          <h5 class="card-title m-0">Revenue</h5>
          <div class="bar-chart">
            <canvas
              baseChart
              [data]="revenueChartData"
              [type]="revenueChartType"
              [options]="revenueChartOptions"
            >
            </canvas>
          </div>
        </mat-card>
      </div>

  </div>

  <!-- Recent Orders -->
  <div class="orders-table-container mat-elevation-z2">
    <div class="table-header d-flex justify-content-between align-items-center">
      <h3>Recent Orders</h3>
      <button mat-raised-button color="primary" (click)="navigateToOrders()">
        View All Orders
      </button>
    </div>

    <app-generic-table
      [data]="dataSource"
      [columns]="tableColumns"
      [isLoading]="isLoadingStats"
      emptyMessage="No recent orders found."
      (rowClick)="onOrderClick($event)"
    ></app-generic-table>
  </div>
</ng-container>

<ng-template #pendingMessage>
  <div class="mt-4">
    <app-status-card></app-status-card>
  </div>
</ng-template>
