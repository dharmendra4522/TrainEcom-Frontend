<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fs-4 fw-bold text-dark m-0" *ngIf="isApproved">Dashboard</h2>
</div>

<ng-container *ngIf="isApproved; else pendingMessage">
  <!-- Stats Cards using Metrics Sub-component -->
  <app-metrics
    [stats]="stats"
    [isLoadingStats]="isLoadingStats"
    [totalUsers]="totalUsers"
    [totalCustomers]="totalCustomers"
    [totalVendors]="totalVendors"
    [totalAdminUsers]="totalAdminUsers"
    [totalOrders]="totalOrders"
    [activeOrders]="activeOrders"
    [deliveredOrders]="deliveredOrders"
    [cancelOrders]="cancelOrders"
    [shippedOrders]="shippedOrders"
    [portal]="portal"
    (statCardClick)="onStatCardClick($event)"
  ></app-metrics>

  <!-- cart section -->
  <div class="row my-4 align-items-stretch">
    <!-- user chart -->
    <div class="col-md-3 mb-3">
      <mat-card class="p-3 chart-card">
        <ng-container *ngIf="isLoadingChartData; else chartContent">
          <div class="spinner-container">
            <mat-spinner diameter="30"></mat-spinner>
          </div>
        </ng-container>
        <ng-template #chartContent>
          <h5 class="card-title mb-3 fw-bold">Total Users</h5>
          <span class="fw-bold fs-5 text-dark">{{ totalUsers }}</span>
          <div class="bar-chart">
            <canvas
              baseChart
              [data]="userChartData"
              [type]="userChartsType"
              [options]="userChartOptions"
            >
            </canvas>
          </div>
        </ng-template>
      </mat-card>
    </div>

    <!-- product section -->
   <div class="col-md-9 mb-3">
      <mat-card class="p-3 chart-card">
        <ng-container *ngIf="isLoadingStats; else orderContentLoaded">
          <div class="spinner-container">
            <mat-spinner diameter="30"></mat-spinner>
          </div>
        </ng-container>
        <ng-template #orderContentLoaded>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title m-0 fw-bold">Order</h5>
            <div>
              <mat-icon>filter_list</mat-icon>
            </div>
          </div>
          <div class="bar-chart">
            <canvas
              baseChart
              [data]="orderChartData"
              [type]="orderChartType"
              [options]="orderChartOptions"
            >
            </canvas>
          </div>
        </ng-template>
      </mat-card>
    </div>

    <!-- category chart -->
    <div class="col-md-6 mb-3">
      <mat-card class="p-3 chart-card">
        <ng-container *ngIf="isLoadingStats; else categoryContentLoaded">
          <div class="spinner-container">
            <mat-spinner diameter="30"></mat-spinner>
          </div>
        </ng-container>
        <ng-template #categoryContentLoaded>
          <h5 class="card-title m-0 fw-bold">Category</h5>
          <div class="bar-chart">
            <canvas
              baseChart
              [data]="productChartData"
              [type]="productChartType"
              [options]="productChartOptions"
            >
            </canvas>
          </div>
        </ng-template>
      </mat-card>
    </div>

    <!-- revenue chart -->
    <div class="col-md-6 mb-3">
      <mat-card class="p-3 chart-card">
        <ng-container *ngIf="isLoadingStats; else revenueContentLoaded">
          <div class="spinner-container">
            <mat-spinner diameter="30"></mat-spinner>
          </div>
        </ng-container>
        <ng-template #revenueContentLoaded>
          <h5 class="card-title m-0 fw-bold">Revenue</h5>
          <div class="bar-chart">
            <canvas
              baseChart
              [data]="revenueChartData"
              [type]="revenueChartType"
              [options]="revenueChartOptions"
            >
            </canvas>
          </div>
        </ng-template>
      </mat-card>
    </div>
  </div>

  <!-- Recent Orders -->
  <div class="orders-table-container mat-elevation-z2">
    <div class="table-header d-flex justify-content-between align-items-center">
      <h3>Recent Orders</h3>
      <button mat-raised-button color="primary" (click)="navigateToOrders()">
        View All Orders
      </button>
    </div>

    <app-generic-table
      [data]="dataSource"
      [columns]="tableColumns"
      [isLoading]="isLoadingStats"
      emptyMessage="No recent orders found."
      (rowClick)="onOrderClick($event)"
    ></app-generic-table>
  </div>
</ng-container>

<ng-template #pendingMessage>
  <div class="mt-4">
    <app-status-card></app-status-card>
  </div>
</ng-template>
