<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fs-4 fw-bold text-dark m-0">Dashboard Overview</h2>
</div>

<div class="stats-grid">
  <mat-card *ngFor="let stat of stats" class="stat-card">
    <mat-card-content>
      <div class="stat-info">
        <span class="stat-title">{{ stat.title }}</span>
        <h2 class="stat-value">{{ stat.value }}</h2>
      </div>
      <mat-icon [style.color]="stat.color">{{ stat.icon }}</mat-icon>
    </mat-card-content>
  </mat-card>
</div>

<div class="orders-table-container mat-elevation-z2">
  <div class="table-header">
    <h3>Recent Orders</h3>
  </div>

  <table mat-table [dataSource]="dataSource" class="orders-table">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>Order ID</th>
      <td mat-cell *matCellDef="let element" class="order-id">
        {{ element.id }}
      </td>
    </ng-container>

    <ng-container matColumnDef="customer">
      <th mat-header-cell *matHeaderCellDef>Customer</th>
      <td mat-cell *matCellDef="let element">{{ element.customer }}</td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let element">{{ element.date }}</td>
    </ng-container>

    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef>Total</th>
      <td mat-cell *matCellDef="let element" class="order-total">
        {{ element.total }}
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element">
        <span class="status-badge" [ngClass]="element.status.toLowerCase()">
          {{ element.status }}
        </span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
