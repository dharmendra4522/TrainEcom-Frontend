<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fs-4 fw-bold text-dark m-0" *ngIf="isApproved">Dashboard</h2>
</div>

<ng-container *ngIf="isApproved; else pendingMessage">
  <!-- Stats Cards using Metrics Sub-component -->
  <app-metrics
    [stats]="stats"
    [isLoadingStats]="isLoadingStats"
    [totalUsers]="totalUsers"
    [totalCustomers]="totalCustomers"
    [totalVendors]="totalVendors"
    [totalAdminUsers]="totalAdminUsers"
    [totalStaffUsers]="totalStaffUsers"
    [totalOrders]="totalOrders"
    [activeOrders]="activeOrders"
    [deliveredOrders]="deliveredOrders"
    [cancelOrders]="cancelOrders"
    [shippedOrders]="shippedOrders"
    [portal]="portal"
    (statCardClick)="onStatCardClick($event)"
  ></app-metrics>

  <!-- cart section -->
  <app-charts
    [totalUsers]="totalUsers"
    [totalCustomers]="totalCustomers"
    [totalVendors]="totalVendors"
    [totalAdminUsers]="totalAdminUsers"
    [totalStaffUsers]="totalStaffUsers"
    [isVendor]="isVendor"
    [isLoading]="isLoadingStats"
  ></app-charts>

  <!-- Recent Orders -->
  <div class="orders-table-container mat-elevation-z2">
    <div class="table-header d-flex justify-content-between align-items-center">
      <h3 class="fw-bold text-dark">Recent Orders</h3>
      <button mat-raised-button color="primary" (click)="navigateToOrders()">
        View All Orders
      </button>
    </div>

    <app-generic-table
      [data]="dataSource"
      [columns]="tableColumns"
      [showIndex]="false"
      [isLoading]="isLoadingStats"
      emptyMessage="No recent orders found."
      (rowClick)="onOrderClick($event)"
    ></app-generic-table>
  </div>
</ng-container>

<ng-template #pendingMessage>
  <div class="mt-4">
    <app-status-card></app-status-card>
  </div>
</ng-template>
