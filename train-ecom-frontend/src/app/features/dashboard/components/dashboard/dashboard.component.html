<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fs-4 fw-bold text-dark m-0" *ngIf="isApproved">Dashboard</h2>
</div>

<ng-container *ngIf="isApproved; else pendingMessage">
  <!-- Stats Cards -->
  <div class="stats-grid" *ngIf="stats && stats.length > 0">
    <mat-card *ngFor="let stat of stats" 
              class="stat-card" 
              [class.has-link]="stat.route"
              (click)="onStatCardClick(stat.route)" 
              [style.cursor]="stat.route ? 'pointer' : 'default'">
      <mat-card-content>
        <div class="stat-info" [class.w-75]="isLoadingStats">
          <span class="stat-title">{{ stat.title }}</span>

          <h2 class="stat-value" *ngIf="!isLoadingStats; else valueLoader">
            {{ stat.value }}
          </h2>
          <ng-template #valueLoader>
            <div class="placeholder-glow mt-1">
              <span class="placeholder col-6 rounded"></span>
            </div>
          </ng-template>
        </div>
        <mat-icon
          *ngIf="!isLoadingStats; else iconLoader"
          [style.color]="stat.color"
          >{{ stat.icon }}</mat-icon
        >
        <ng-template #iconLoader>
          <div class="placeholder-glow">
            <span
              class="placeholder rounded-circle"
              style="width: 40px; height: 40px; display: inline-block"
            ></span>
          </div>
        </ng-template>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- cart section -->
  <div class="row my-4">
    <div class="col-md-6 mb-3">
      <mat-card class="p-3 h-100">
        <h5 class="card-title mb-3">User Distribution</h5>
        <div class="bar-chart">
          <canvas baseChart
          [data]="userChartData"
          [type]="userChartsType"
          [options]="userChartOptions"
          >

          </canvas>
        </div>
      </mat-card>
    </div>

    <!-- product section -->
     <div class="col-md-6 mb-3">
      <mat-card class="p-3 h-100">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 clas="card-title m-0">Product Analytics</h5>
          <div class="btn-group btn-group-sm" role="group">
            <button mat-flat-button [color]="isCategoryView ? 'primary' : ''"
            (click)="toggleProductView('category')">
              Category
            </button>
             <button mat-flat-button [color]="!isCategoryView ? 'primary' : ''"
              (click)="toggleProductView('brand')">
              Brand
            </button>
          </div>
        </div>
        <div class="bar-cart">
          <canvas baseChart
            [data]="productChartData"
            [type]="productChartType"
            [options]="productChartOptions">
          </canvas>
        </div>
      </mat-card>
     </div>

  </div>

  <!-- Recent Orders -->
  <div class="orders-table-container mat-elevation-z2">
    <div class="table-header d-flex justify-content-between align-items-center">
      <h3>Recent Orders</h3>
      <button mat-raised-button color="primary" (click)="navigateToOrders()">
        View All Orders
      </button>
    </div>

    <app-generic-table
      [data]="dataSource"
      [columns]="tableColumns"
      [isLoading]="isLoadingStats"
      emptyMessage="No recent orders found."
      (rowClick)="onOrderClick($event)"
    ></app-generic-table>
  </div>
</ng-container>

<ng-template #pendingMessage>
  <div class="mt-4">
    <app-status-card></app-status-card>
  </div>
</ng-template>
