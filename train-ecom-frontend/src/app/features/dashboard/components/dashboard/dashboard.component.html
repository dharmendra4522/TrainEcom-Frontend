<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fs-4 fw-bold text-dark m-0">Dashboard Overview</h2>
</div>

<!-- Stats Cards -->
<div class="stats-grid" *ngIf="!isLoadingStats; else statsLoader">
  <mat-card *ngFor="let stat of stats" class="stat-card">
    <mat-card-content>
      <div class="stat-info">
        <span class="stat-title">{{ stat.title }}</span>
        <h2 class="stat-value">{{ stat.value }}</h2>
      </div>
      <mat-icon [style.color]="stat.color">{{ stat.icon }}</mat-icon>
    </mat-card-content>
  </mat-card>
</div>

<ng-template #statsLoader>
  <div class="stats-grid">
    <mat-card *ngFor="let i of stats" class="stat-card">
      <mat-card-content>
        <div class="stat-info w-75">
          <div class="placeholder-glow mb-2">
            <span class="placeholder col-8 rounded stat-title"></span>
          </div>
          <div class="placeholder-glow">
            <span class="placeholder col-6 rounded stat-value"></span>
          </div>
        </div>
        <div class="placeholder-glow">
          <span class="placeholder rounded-circle" style="width: 40px; height: 40px;"></span>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</ng-template>

<!-- Recent Orders -->
<div class="orders-table-container mat-elevation-z2" *ngIf="isVendorStatus || stats.length>2; else pendingMessage">
  <div class="table-header d-flex justify-content-between align-items-center">
    <h3>Recent Orders</h3>
    <button mat-raised-button color="primary" (click)="navigateToOrders()">
      View All Orders

    </button>
  </div>

  <app-generic-table
    [data]="dataSource"
    [columns]="tableColumns"
    [isLoading]="isLoadingStats"
    emptyMessage="No recent orders found."
    (rowClick)="onOrderClick($event)"
  ></app-generic-table>
</div>


<ng-template #pendingMessage>
<div class="">
  <app-status-card>
    
  </app-status-card>
</div>
</ng-template>
