<div class="row my-4 align-items-stretch">
  <!-- user chart -->
  <div class="col-md-5 col-lg-3 mb-3 d-flex">
    <mat-card class="p-3 chart-card w-100">
      <ng-container *ngIf="isLoading; else chartContent">
        <div class="spinner-container">
          <mat-spinner diameter="30"></mat-spinner>
        </div>
      </ng-container>
      <ng-template #chartContent>
        <div>
          <h5 class="card-title m-0 fw-bold">Users</h5>
          <span class="fw-bold fs-5 text-dark" *ngIf="totalUsers > 0">
            {{ totalUsers }}</span
          >
        </div>
        <div class="bar-chart">
          <canvas
            baseChart
            [data]="userChartData"
            [type]="userChartsType"
            [options]="userChartOptions"
          ></canvas>
        </div>
      </ng-template>
    </mat-card>
  </div>

  <!-- order chart -->
  <div class="col-md-7 col-lg-9 mb-3">
    <app-order-chart
      [isLoading]="isLoading"
      [portal]="portal"
      [isVendor]="isVendor"
    ></app-order-chart>
  </div>

  <!-- category chart -->
  <div class="col-md-6 mb-3">
    <app-category-chart
      [isLoading]="isLoading"
      [portal]="portal"
      [isVendor]="isVendor"
    >
    </app-category-chart>
  </div>

  <!-- revenue chart -->
  <div class="col-md-6 mb-3">
    <app-revenue-chart
      [isLoading]="isLoading"
      [portal]="portal"
      [isVendor]="isVendor"
    >
    </app-revenue-chart>
  </div>
</div>
