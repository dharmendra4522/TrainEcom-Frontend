<div
  class="bg-image-container container-fluid d-flex justify-content-center justify-content-md-start align-items-center min-vh-100 bg-light py-4 px-3 px-sm-4"
>
  <mat-card class="glass-card p-4 p-md-5 shadow-sm border-0 rounded-4 bg-white">
    <div class="text-center mb-4">
      <h2 class="fw-bold mb-2 text-dark fs-3">Log in to TrainEcom</h2>
      <p class="text-secondary mb-0">Please enter your details</p>
    </div>
 
    <mat-card-content class="p-0">
      <form
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        class="d-flex flex-column gap-3"
      >
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Email</mat-label>
          <mat-icon matPrefix class="me-2 text-secondary">email</mat-icon>
          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="Ex. user@example.com"
          />
 
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            Email address is required.
          </mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
            Please enter a valid email address.
          </mat-error>
        </mat-form-field>
 
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Password</mat-label>
          <mat-icon matPrefix class="me-2 text-secondary">lock</mat-icon>
          <input
            matInput
            [type]="isShowingPassword ? 'text' : 'password'"
            formControlName="password"
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="
              isShowingPassword ? 'Hide password' : 'Show password'
            "
            [attr.aria-pressed]="isShowingPassword"
          >
            <mat-icon>{{
              isShowingPassword ? "visibility" : "visibility_off"
            }}</mat-icon>
          </button>
 
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required.
          </mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            Password must be at least 6 characters long.
          </mat-error>
        </mat-form-field>
 
        <div class="d-flex justify-content-end mt-n2">
          <span class="forget-pwd-link fw-medium">Forget Password?</span>
        </div>
 
        <mat-error
          *ngIf="error$ | async as serverError"
          class="text-center text-danger fw-medium mt-2"
        >
          {{ serverError }}
        </mat-error>
 
        <button
          type="submit"
          mat-flat-button
          color="primary"
          class="w-100 py-3 mt-2 fs-6 fw-bold rounded-3 shadow-sm"
          [disabled]="loginForm.invalid"
        >
          Log In
        </button>
 
        <p class="text-center mt-4 text-secondary">
          Don't have an account?
          <a routerLink="/signup" class="auth-accent-link ms-1"
            >Register here</a
          >
        </p>
      </form>
    </mat-card-content>
  </mat-card>
</div>
