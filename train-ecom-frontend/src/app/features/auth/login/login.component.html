<app-header></app-header>

<div class="container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Login</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>
                        <mat-icon>email</mat-icon>

                        Email</mat-label>
                    <input matInput type="email" formControlName="email" placeholder="Ex. user@example.com">

                    <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
                        Email address is required.
                    </mat-error>
                    <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
                        Please enter a valid email address.
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>
                        <mat-icon>lock</mat-icon>
                        Password</mat-label>
                    <input matInput type="password" formControlName="password">

                    <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
                        Password is required.
                    </mat-error>
                    <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
                        Password must be at least 6 characters long.
                    </mat-error>
                </mat-form-field>

                <button type="submit" mat-raised-button color="primary" class="full-width"
                    [disabled]="loginForm.invalid">Login</button>

                <a routerLink="/auth/register" class="register-link">Don't have an account? Register here</a>
            </form>
        </mat-card-content>
    </mat-card>
</div>
