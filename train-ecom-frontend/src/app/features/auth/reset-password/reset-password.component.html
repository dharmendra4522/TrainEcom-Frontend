<div
  class="bg-image-container container-fluid d-flex justify-content-center justify-content-md-start align-items-center min-vh-100 bg-light py-4 px-3 px-sm-4"
>
  <mat-card class="glass-card p-4 p-md-5 shadow-sm border-0 rounded-4 bg-white">
    <div class="text-center mb-4">
      <h2 class="fw-bold mb-2 text-dark fs-3">Reset Password</h2>
      <p class="text-secondary mb-0">Please enter your new password</p>
    </div>

    <mat-card-content class="p-0">
      <form
        [formGroup]="resetPasswordForm"
        (ngSubmit)="onSubmit()"
        class="d-flex flex-column gap-3"
      >
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>New Password</mat-label>
          <mat-icon matPrefix class="me-2 text-secondary">lock</mat-icon>
          <input
            matInput
            [type]="isShowingPassword ? 'text' : 'password'"
            formControlName="password"
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="isShowingPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="isShowingPassword"
          >
            <mat-icon>{{ isShowingPassword ? "visibility" : "visibility_off" }}</mat-icon>
          </button>

          <mat-error *ngIf="resetPasswordForm.get('password')?.hasError('required')">
            Password is required.
          </mat-error>
          <mat-error *ngIf="resetPasswordForm.get('password')?.hasError('minlength') && !resetPasswordForm.get('password')?.hasError('required')">
            Password must be at least 6 characters long.
          </mat-error>
          <mat-error *ngIf="resetPasswordForm.get('password')?.hasError('pattern') && !resetPasswordForm.get('password')?.hasError('minlength') && !resetPasswordForm.get('password')?.hasError('required')" style="white-space: normal; line-height: 1.2; font-size: 11px; margin-top: 4px;">
            Must have 1 uppercase, 1 number & 1 special char.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Confirm Password</mat-label>
          <mat-icon matPrefix class="me-2 text-secondary">lock_outline</mat-icon>
          <input
            matInput
            [type]="isShowingConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="toggleConfirmPasswordVisibility()"
            [attr.aria-label]="isShowingConfirmPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="isShowingConfirmPassword"
          >
            <mat-icon>{{ isShowingConfirmPassword ? "visibility" : "visibility_off" }}</mat-icon>
          </button>

          <mat-error *ngIf="resetPasswordForm.get('confirmPassword')?.hasError('required')">
            Confirm password is required.
          </mat-error>
          <mat-error *ngIf="resetPasswordForm.hasError('mismatch')">
            Passwords do not match.
          </mat-error>
        </mat-form-field>

        <button
          type="submit"
          mat-flat-button
          color="primary"
          class="w-100 py-3 mt-2 fs-6 fw-bold rounded-3 shadow-sm"
          [disabled]="resetPasswordForm.invalid"
        >
          Reset Password
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
