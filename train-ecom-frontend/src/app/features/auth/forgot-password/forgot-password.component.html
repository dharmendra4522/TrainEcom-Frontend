<div
  class="bg-image-container container-fluid d-flex justify-content-center justify-content-md-start align-items-center min-vh-100 bg-light py-4 px-3 px-sm-4"
>
  <mat-card class="glass-card p-4 p-md-5 shadow-sm border-0 rounded-4 bg-white">
    <div class="text-center mb-4">
      <h2 class="fw-bold mb-2 text-dark fs-3">Forgot Password</h2>
      <p class="text-secondary mb-0">Enter your email to receive a reset link</p>
    </div>

    <mat-card-content class="p-0">
      <form
        [formGroup]="forgotPasswordForm"
        (ngSubmit)="onSubmit()"
        class="d-flex flex-column gap-3"
      >
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Email</mat-label>
          <mat-icon matPrefix class="me-2 text-secondary">email</mat-icon>
          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="Ex. user@example.com"
          />

          <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('required')">
            Email address is required.
          </mat-error>
          <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('email')">
            Please enter a valid email address.
          </mat-error>
        </mat-form-field>

        <button
          type="submit"
          mat-flat-button
          color="primary"
          class="w-100 py-3 mt-3 fs-6 fw-bold rounded-3 shadow-sm"
          [disabled]="forgotPasswordForm.invalid"
        >
          Send Reset Link
        </button>

        <p class="text-center mt-4 text-secondary">
          Remember your password?
          <a routerLink="/login" class="auth-accent-link ms-1 fw-bold text-decoration-none">
            Log In
          </a>
        </p>
      </form>
    </mat-card-content>
  </mat-card>
</div>
