<div class="container-fluid mt-2 px-0 banner-management-container">
  <!-- Header section -->
  <div class="banner-settings-header d-flex align-items-start justify-content-between gap-3 p-3">
    <div class="banner-header-copy">
      <h2 class="fs-4 fw-bold text-dark m-0">System Settings</h2>
      <p class="text-muted small m-0">
        Manage your store configurations, banners, and preferences.
      </p>
    </div>
    <button
      mat-raised-button
      color="primary"
      class="flex-shrink-0 banner-add-button"
      (click)="onAddBanner()"
    >
      <mat-icon>add</mat-icon>
      Add
    </button>
  </div>

  <!-- table -->
  <div class="mt-3">
    <app-generic-table
      [columns]="columns"
      [data]="getFormattedBanners()"
      [actions]="actions"
      [showInlineActions]="false"
      [showIndex]="true"
      [enableRowClick]="false"
      (actionClick)="onTableAction($event)"
    >
    </app-generic-table>
  </div>
</div>
