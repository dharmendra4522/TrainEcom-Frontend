<div class="container-fluid px-0 mt-2 mt-sm-4 pb-5">
  <div class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between mb-4 border-bottom pb-3 gap-3">
    <div>
      <h2 class="fw-bold m-0 text-dark">Product Catalog</h2>
      <p class="text-muted small m-0">Discover and filter products in real-time</p>
    </div>
 
    <div class="d-flex gap-2">
      <button
        mat-flat-button
        color="primary"
        class="d-lg-none d-flex align-items-center gap-2"
        (click)="toggleMobileFilters()"
      >
        <mat-icon>filter_alt</mat-icon>
        Filters
      </button>
 
      <button mat-stroked-button color="primary" (click)="goBack()" class="d-flex align-items-center gap-2">
        <mat-icon>arrow_back</mat-icon>
        Back
      </button>  
    </div>
  </div>
 
  <div class="row">
    <div
      class="col-lg-3 mb-4"
      [class.d-none]="!showMobileFilters"
      [class.d-lg-block]="true"
    >
      <div class="filter-sidebar bg-white border rounded-4 p-4 shadow-sm position-sticky" style="top: 100px; z-index: 100;">
       
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
          <h5 class="fw-bold text-dark m-0 d-flex align-items-center gap-2">
            <mat-icon class="text-primary fs-5 w-auto h-auto">tune</mat-icon> Filters
          </h5>
          <button mat-button color="warn" class="fs-8 px-2 py-1 min-width-unset" (click)="resetFilters()">
            Reset All
          </button>
        </div>
 
        <div class="filter-section mb-4">
          <h6 class="fw-bold text-dark mb-3">Category</h6>
          <select
            class="form-select border rounded-3 p-2 bg-light text-dark fs-7"
            [value]="(route.queryParams | async)?.['category'] || ''"
            (change)="onCategoryChange($any($event.target).value)"
          >
            <option value="">All Categories</option>
            <ng-container *ngIf="categories$ | async as categories">
              <option *ngFor="let cat of categories" [value]="cat.name">
                {{ cat.name }}
              </option>
            </ng-container>
          </select>
        </div>
 
        <div class="filter-section mb-4">
          <h6 class="fw-bold text-dark mb-3">Brand</h6>
          <select
            class="form-select border rounded-3 p-2 bg-light text-dark fs-7"
            [value]="(route.queryParams | async)?.['brand'] || ''"
            (change)="onBrandChange($any($event.target).value)"
          >
            <option value="">All Brands</option>
            <ng-container *ngIf="brands$ | async as brands">
              <option *ngFor="let brand of brands" [value]="brand.name">
                {{ brand.name }}
              </option>
            </ng-container>
          </select>
        </div>
 
        <div class="filter-section mb-4">
          <h6 class="fw-bold text-dark mb-2">Price</h6>
          <div class="text-dark fw-bold mb-2 fs-6">
            ₹150 - ₹{{ maxPriceSliderValue >= 10000 ? '10,000+' : (maxPriceSliderValue | number:'1.0-0') }}
          </div>
          <div class="slider-container px-1">
            <input type="range"
                   min="150"
                   max="10000"
                   step="50"
                   [value]="maxPriceSliderValue"
                   (input)="onPriceSliderChange(+$any($event.target).value)"
                   class="custom-slider w-100" />
          </div>
        </div>
 
        <div class="filter-section mb-4">
          <h6 class="fw-bold text-dark mb-3">Customer Rating</h6>
          <select
            class="form-select border rounded-3 p-2 bg-light text-dark fs-7"
            [value]="activeRating === null ? '' : activeRating"
            (change)="setRating($any($event.target).value ? +$any($event.target).value : null)"
          >
            <option value="">All Ratings</option>
            <option value="4">4 Stars & Up</option>
            <option value="3">3 Stars & Up</option>
            <option value="2">2 Stars & Up</option>
          </select>
        </div>
 
        <div class="filter-section">
          <h6 class="fw-bold text-dark mb-3">Sort By</h6>
          <select
            class="form-select border rounded-3 p-2 bg-light text-dark fs-7"
            [value]="activeSort"
            (change)="setSortBy($any($event.target).value)"
          >
            <option value="popularity">Popularity</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="newest">Newest Arrivals</option>
          </select>
        </div>
 
      </div>
    </div>
 
    <div class="col-lg-9">
      <div *ngIf="isLoading$ | async" class="d-flex justify-content-center py-5">
        <mat-spinner diameter="45"></mat-spinner>
      </div>
 
      <ng-container *ngIf="!(isLoading$ | async)">
        <ng-container *ngIf="filteredProducts$ | async as productsList">
          <div *ngIf="productsList.length > 0; else noProducts" class="row row-cols-2 row-cols-sm-2 row-cols-md-3 row-cols-xl-3 g-2 g-sm-3 g-md-4 py-2 px-0 m-0">
            <div class="col d-flex align-items-stretch" *ngFor="let product of productsList">
              <app-product-card [product]="product" class="w-100"></app-product-card>
            </div>
          </div>
        </ng-container>
 
        <ng-template #noProducts>
          <div class="text-center py-5 bg-light rounded-4 mt-4">
            <mat-icon class="text-muted display-6 mb-2">inventory_2</mat-icon>
            <p class="text-muted fw-medium m-0">No products found for these filter settings.</p>
          </div>
        </ng-template>
      </ng-container>
    </div>
  </div>
</div>
