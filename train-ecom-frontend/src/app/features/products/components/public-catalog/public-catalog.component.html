<div class="container-fluid px-2 px-sm-3 px-md-4 mt-2 mt-sm-3 pb-5">
  <!-- Page Title & Top Actions -->
  <div
    class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between mb-4 border-bottom pb-3 gap-3">
    <div>
      <h2 class="fw-bold m-0 text-dark">Product Catalog</h2>
      <p class="text-muted small m-0">
        Discover and filter products in real-time
      </p>
    </div>

    <div class="d-flex gap-2">
      <button mat-flat-button color="primary" class="d-lg-none d-flex align-items-center gap-2"
        (click)="toggleMobileFilters()">
        <mat-icon>filter_alt</mat-icon>
        Filters
      </button>

      <button mat-stroked-button color="primary" (click)="goBack()" class="d-flex align-items-center gap-2">
        <mat-icon>arrow_back</mat-icon>
        Back
      </button>
    </div>
  </div>

  <div class="row g-3 g-md-4">
    <!-- Left Filter Sidebar -->
    <div class="col-lg-3 col-xl-2 mb-4" [class.d-none]="!showMobileFilters" [class.d-lg-block]="true">
      <app-catalog-filter [categories]="(categories$ | async) || []" [brands]="(brands$ | async) || []"
        [selectedCategory]="(route.queryParams | async)?.['category'] || ''"
        [selectedBrand]="(route.queryParams | async)?.['brand'] || ''" [maxPriceSliderValue]="maxPriceSliderValue"
        [activeRating]="activeRating" [activeSort]="activeSort" (categoryChange)="onCategoryChange($event)"
        (brandChange)="onBrandChange($event)" (priceSliderChange)="onPriceSliderChange($event)"
        (ratingChange)="setRating($event)" (sortChange)="setSortBy($event)" (resetAll)="resetFilters()">
      </app-catalog-filter>
    </div>

    <!-- Main Products Grid -->
    <div class="col-lg-9 col-xl-10 products-column">
      <!-- Initial Loading Spinner (Pehla Page Fetch) -->
      <div *ngIf="(isLoading$ | async) && currentPage === 1" class="d-flex justify-content-center py-5">
        <mat-spinner diameter="45"></mat-spinner>
      </div>

      <ng-container *ngIf="filteredProducts$ | async as products">
        <div *ngIf="products.length > 0; else noProducts">
          <!-- Cards follow the available product-area width, rather than only the viewport width. -->
          <div class="product-grid">
            <div class="product-grid-item" *ngFor="let product of products">
              <app-product-card [product]="product" class="w-100"></app-product-card>
            </div>
          </div>

          <!-- Infinite Scroll Bottom Loading Spinner -->
          <div *ngIf="(isLoading$ | async) && currentPage > 1" class="d-flex justify-content-center py-4">
            <mat-spinner diameter="35"></mat-spinner>
          </div>
        </div>

        <!-- No Products Found State -->
        <ng-template #noProducts>
          <div *ngIf="!(isLoading$ | async)" class="text-center py-5 bg-light rounded-4 mt-2">
            <mat-icon class="text-muted display-6 mb-2">inventory_2</mat-icon>
            <p class="text-muted fw-medium m-0">
              No products found for these filter settings.
            </p>
          </div>
        </ng-template>
      </ng-container>
    </div>
  </div>
</div>
