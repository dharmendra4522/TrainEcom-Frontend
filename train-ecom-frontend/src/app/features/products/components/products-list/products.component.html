<div class="page-container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fs-4 fw-bold text-dark m-0">Product Management</h2>
    <button mat-raised-button color="primary" routerLink="/admin/products/add">
      <mat-icon>add</mat-icon> Add New Product
    </button>
  </div>

  <!-- Search & Filter Section -->
  <div class="row g-3 mb-4 align-items-center">
    <div class="col-md-6">
      <mat-form-field appearance="outline" class="w-100 mb-0">
        <mat-label>Search products</mat-label>
        <mat-icon matPrefix class="text-secondary">search</mat-icon>
        <input matInput [formControl]="searchControl" placeholder="Search by name or description...">
      </mat-form-field>
    </div>

    <div class="col-md-2">
      <mat-form-field appearance="outline" class="w-100 mb-0">
        <mat-label>Category</mat-label>
        <mat-select [formControl]="categoryControl">
          <mat-option value="">All Categories</mat-option>
          <mat-option *ngFor="let cat of categories$ | async" [value]="cat.name">
            {{ cat.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="col-md-2">
      <mat-form-field appearance="outline" class="w-100 mb-0">
        <mat-label>Brand</mat-label>
        <mat-select [formControl]="brandControl">
          <mat-option value="">All Brands</mat-option>
          <mat-option *ngFor="let brand of brands$ | async" [value]="brand.name">
            {{ brand.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="col-md-2" *ngIf="searchControl.value || categoryControl.value || brandControl.value">
      <button mat-stroked-button color="warn" (click)="clearFilters()"
        class="w-100 py-3 d-flex align-items-center justify-content-center gap-1">
        <mat-icon>clear</mat-icon> Clear
      </button>
    </div>
  </div>

  <app-generic-table [data]="(products$ | async) || []" [isLoading]="(isLoading$ | async) || false" [columns]="columns"
    [actions]="actions" [showInlineActions]="true" [showPaginator]="true" [totalRecords]="(totalRecords$ | async) || 0" [pageSize]="pageSize"
    [pageIndex]="pageNumber - 1" emptyMessage="No products found." (rowClick)="onRowClick($event)"
    (actionClick)="handleTableAction($event)" (pageChange)="onPageChange($event)">
  </app-generic-table>
</div>
