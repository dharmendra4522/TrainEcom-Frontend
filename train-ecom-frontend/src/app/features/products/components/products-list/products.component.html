<div class="container-fluid mt-2 px-0">
  <div class="sticky-top-section">
    <div class="row align-items-center mb-4 g-3">
      <div class="col-12 col-md-5">
        <h2 class="fs-4 fw-bold text-dark m-0">Product Management</h2>
        <p class="text-muted small m-0">View, search, and manage all products from one place.</p>
      </div>
      <div class="col-12 col-md-5">
        <mat-form-field appearance="outline" class="w-100 mb-0" subscriptSizing="dynamic">
          <mat-label>Search products</mat-label>
          <mat-icon matPrefix class="text-secondary">search</mat-icon>
          <input matInput [formControl]="searchControl" placeholder="Search by name or description...">
        </mat-form-field>
      </div>
      <div class="col-12 col-md-2 text-md-end">
        <button mat-raised-button color="primary" [routerLink]="portalRoutes.products(portal, 'add')" class="w-100 w-md-auto" style="height:50px">
        <mat-icon>add</mat-icon> <span class="d-none d-md-inline">Add New Product</span><span class="d-inline d-lg-none">Add</span>
      </button>
      </div>
    </div>

    <!-- Search & Filter Section -->
    <div class="row g-3 align-items-center">

      <div class="col-md-4">
        <mat-form-field appearance="outline" class="w-100 mb-0" subscriptSizing="dynamic">
          <mat-label>Category</mat-label>
          <mat-select [formControl]="categoryControl">
            <mat-option value="">All Categories</mat-option>
            <mat-option *ngFor="let cat of categories$ | async" [value]="cat.name">
              {{ cat.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="col-md-4">
        <mat-form-field appearance="outline" class="w-100 mb-0" subscriptSizing="dynamic">
          <mat-label>Brand</mat-label>
          <mat-select [formControl]="brandControl">
            <mat-option value="">All Brands</mat-option>
            <mat-option *ngFor="let brand of brands$ | async" [value]="brand.name">
              {{ brand.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="col-12 col-md-4 d-flex align-items-center" *ngIf="searchControl.value || categoryControl.value || brandControl.value">
        <button mat-stroked-button color="warn" (click)="clearFilters()"
          class="w-100 d-flex align-items-center justify-content-center gap-1 rounded-3" style="height: 48px;">
          <mat-icon>clear</mat-icon> Clear
        </button>
      </div>
    </div>
  </div>

  <app-generic-table [data]="(ProductList)" [isLoading]="(isLoading$ | async) || false" [columns]="columns"
    [actions]="actions" [showInlineActions]="true" [hasMoreData]="hasMoreData" 
    emptyMessage="No products found." (rowClick)="onRowClick($event)"
    (actionClick)="handleTableAction($event)" (loadMore)="onScrollLoad()">
  </app-generic-table>
</div>
