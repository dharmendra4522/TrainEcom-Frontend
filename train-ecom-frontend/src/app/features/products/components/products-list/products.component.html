<div class="container-fluid mt-2 px-0">
  <div class="sticky-top-section mb-4">
    <div class="row align-items-center g-3">
      <!-- Title section -->
      <div class="col-12 col-md-6 col-lg-4">
        <h2 class="fs-4 fw-bold text-dark m-0">Product Management</h2>
        <p class="text-muted small m-0">View and manage products.</p>
      </div>

      <div
        class="col-12 col-md-6 col-lg-8 d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center justify-content-sm-end gap-3"
      >
        <!-- Search -->
        <mat-form-field
          appearance="outline"
          class="product-filter-field product-search-field mb-0"
          subscriptSizing="dynamic"
          floatLabel="always"
        >
          <mat-label>Search products</mat-label>
          <mat-icon matPrefix class="text-secondary">search</mat-icon>
          <input
            matInput
            [formControl]="searchControl"
            placeholder="Search..."
          />
          <button
            *ngIf="hasActiveFilters"
            mat-icon-button
            matSuffix
            type="button"
            color="warn"
            aria-label="Clear product filters"
            title="Clear filters"
            (click)="clearFilters()"
          >
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>

        <!-- Add button -->
        <button
          mat-raised-button
          color="primary"
          [routerLink]="portalRoutes.products(portal, 'add')"
          class="product-toolbar-button flex-shrink-0"
        >
          <mat-icon>add</mat-icon> <span>Add</span>
        </button>
      </div>
    </div>
  </div>

  <app-generic-table
    [data]="ProductList"
    [isLoading]="(isLoading$ | async) || false"
    [columns]="columns"
    [actions]="actions"
    [showInlineActions]="false"
    [hasMoreData]="hasMoreData"
    emptyMessage="No products found."
    (rowClick)="onRowClick($event)"
    (actionClick)="handleTableAction($event)"
    (loadMore)="onScrollLoad()"
    [showheaderFilter]="showHeaderFilter"
    [dropdownOptionsMap]="dropdownOptionsMap"
    [dropdownLoadingMap]="dropdownLoadingMap"
    [selectedFiltersMap]="selectedFiltersMap"
    [rangeBoundsMap]="rangeBoundsMap"
    [selectedRangesMap]="selectedRangesMap"
    [filterResetToken]="filterResetToken"
    (dropdownSearchChange)="onDropdownSearchTriggered($event)"
    (dropdownOpened)="onDropdownOpened($event)"
    (dropdownScrolled)="onDropdownScrolled($event)"
    (dropdownSelectionChange)="onDropdownSelectionChanged($event)"
    (filterApply)="onFilterApply($event)"
    (filterClear)="onFilterClear($event)"
    (filterChanged)="onTableFilterChanged($event)"
    (priceRangeChange)="onRangeFilterChanged($event)"
    (stockRangeChange)="onRangeFilterChanged($event)"
  >
  </app-generic-table>
</div>
