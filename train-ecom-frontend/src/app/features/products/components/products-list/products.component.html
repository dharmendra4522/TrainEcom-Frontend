<div class="page-container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fs-4 fw-bold text-dark m-0">Product Management</h2>
    <button mat-raised-button color="primary" routerLink="/admin/products/add">
      <mat-icon>add</mat-icon> Add New Product
    </button>
  </div>

  <app-generic-table 
    [data]="(products$ | async) || []" 
    [isLoading]="(isLoading$ | async) || false"
    [columns]="columns" 
    [actions]="actions" 
    [showPaginator]="true"
    [totalRecords]="(products$ | async)?.length || 0" 
    [pageSize]="pageSize" 
    [pageIndex]="pageNumber - 1" 
    emptyMessage="No products found."
    (actionClick)="handleTableAction($event)" 
    (pageChange)="onPageChange($event)">
  </app-generic-table>
</div>
