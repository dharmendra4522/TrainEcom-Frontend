<div class="container mt-4">
    <mat-card class="p-4 shadow-sm">
        <mat-card-header class="mb-3">
            <mat-card-title class="fs-5 fw-bold">Add New Product</mat-card-title>
        </mat-card-header>

        <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3">
            <div class="row">
                <div class="col-md-6">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Product Name</mat-label>
                        <input matInput formControlName="title" placeholder="Enter product name">
                    </mat-form-field>
                </div>
                <div class="col-md-3">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Price</mat-label>
                        <input matInput type="number" formControlName="price" placeholder="0.00">
                    </mat-form-field>
                </div>
                <div class="col-md-3">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Stock</mat-label>
                        <input matInput type="number" formControlName="stock" placeholder="0">
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Brand</mat-label>
                        <input type="text" matInput [formControl]="brandControl" [matAutocomplete]="brandAuto">

                        <mat-autocomplete #brandAuto="matAutocomplete" [displayWith]="displayBrandName.bind(this)"
                            (optionSelected)="onBrandSelected($event)">

                            <mat-option *ngFor="let brand of filteredBrands | async" [value]="brand.id">
                                {{ brand.name }}
                            </mat-option>

                            <mat-option (click)="openAddDialog('brand')" class="text-primary font-weight-bold">
                                + Create New Brand
                            </mat-option>
                        </mat-autocomplete>
                    </mat-form-field>
                </div>
                <div class="col-md-6">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Category</mat-label>
                        <input type="text" matInput [formControl]="categoryControl" [matAutocomplete]="categoryAuto">

                        <mat-autocomplete #categoryAuto="matAutocomplete" [displayWith]="displayCategoryName.bind(this)" (optionSelected)="onCategorySelected($event)">
                            <mat-option *ngFor="let category of filteredCategories | async" [value]="category.id">
                                {{ category.name }}
                            </mat-option>

                            <mat-option (click)="openAddDialog('category')" class="text-primary font-weight-bold">
                                + Create New Category
                            </mat-option>
                        </mat-autocomplete>
                    </mat-form-field>
                </div>
            </div>

            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Description</mat-label>
                <textarea matInput formControlName="description" rows="4"></textarea>
            </mat-form-field>

            <div class="mt-3">
                <label class="form-label fw-bold">Product Images</label>

                <div formArrayName="images" class="d-flex flex-column gap-2">
                    <div *ngFor="let image of imageControls; let i = index" class="d-flex align-items-center gap-2">

                        <div class="border p-2 rounded flex-grow-1">
                            <span class="text-muted small">Image {{i + 1}} {{i === 0 ? '(Thumbnail)' : ''}}</span>
                            <input type="file" (change)="onFileChange($event, i)" class="ms-2">
                        </div>

                        <button type="button" mat-icon-button color="warn" *ngIf="i !== 0"
                            (click)="removeImageField(i)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </div>
                </div>

                <button type="button" mat-stroked-button color="primary" class="mt-3" (click)="addImageField()">
                    <mat-icon>add</mat-icon> Add More
                </button>
            </div>

            <div class="mt-4">
                <button mat-raised-button color="primary" type="submit" [disabled]="!productForm.valid">
                    Save Product
                </button>
            </div>
        </form>
    </mat-card>
</div>
