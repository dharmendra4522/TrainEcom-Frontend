<div class="filter-sidebar bg-white border rounded-4 p-4 shadow-sm">
  <div
    class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom"
  >
    <h5 class="fw-bold text-dark m-0 d-flex align-items-center gap-2">
      <mat-icon class="text-primary fs-5 w-auto h-auto">tune</mat-icon>
      Filters
    </h5>
    <button
      mat-button
      color="warn"
      class="fs-8 px-2 py-1 min-width-unset"
      (click)="onReset()"
    >
      Reset All
    </button>
  </div>

  <div class="filter-section mb-4">
    <h6 class="fw-bold text-dark mb-3">Category</h6>
    <select
      class="form-select border rounded-3 p-2 bg-light text-dark fs-7"
      [value]="selectedCategory"
      (change)="onCategoryChange($event)"
    >
      <option value="">All Categories</option>
      <option *ngFor="let cat of categories" [value]="cat.id">
        {{ cat.name }}
      </option>
    </select>
  </div>
  
  <div class="filter-section mb-4">
    <h6 class="fw-bold text-dark mb-3">Sub-category</h6>
    <select
      class="form-select border rounded-3 p-2 bg-light text-dark fs-7"
      [value]="selectedSubCategory"
      [disabled]="!selectedCategory || availableSubCategories.length === 0"
      (change)="onSubCategoryChange($event)"
    >
      <option value="">All Sub-categories</option>
      <option
        *ngFor="let subCategory of availableSubCategories"
        [value]="subCategory.id"
      >
        {{ subCategory.name }}
      </option>
    </select>
  </div>

  <div class="filter-section mb-4">
    <h6 class="fw-bold text-dark mb-3">Brand</h6>
    <select
      class="form-select border rounded-3 p-2 bg-light text-dark fs-7"
      [value]="selectedBrand"
      (change)="onBrandChange($event)"
    >
      <option value="">All Brands</option>
      <option *ngFor="let brand of brands" [value]="brand.id">
        {{ brand.name }}
      </option>
    </select>
  </div>

  <div class="filter-section mb-4">
    <h6 class="fw-bold text-dark mb-2">Price</h6>
    <div class="text-dark fw-bold mb-2 fs-6">
      ₹150 - ₹{{
        maxPriceSliderValue >= 10000
          ? "10,000+"
          : (maxPriceSliderValue | number: "1.0-0")
      }}
    </div>
    <div class="slider-container px-1">
      <input
        type="range"
        min="150"
        max="10000"
        step="50"
        [value]="maxPriceSliderValue"
        (input)="onPriceSliderChange($event)"
        class="custom-slider w-100"
      />
    </div>
  </div>

  <div class="filter-section mb-4">
    <h6 class="fw-bold text-dark mb-3">Customer Rating</h6>
    <select
      class="form-select border rounded-3 p-2 bg-light text-dark fs-7"
      [value]="activeRating === null ? '' : activeRating"
      (change)="onRatingChange($event)"
    >
      <option value="">All Ratings</option>
      <option value="4">4 Stars & Up</option>
      <option value="3">3 Stars & Up</option>
      <option value="2">2 Stars & Up</option>
    </select>
  </div>

  <div class="filter-section">
    <h6 class="fw-bold text-dark mb-3">Sort By</h6>
    <select
      class="form-select border rounded-3 p-2 bg-light text-dark fs-7"
      [value]="activeSort"
      (change)="onSortChange($event)"
    >
      <option value="">Default (None)</option>
      <option value="Newest">Newest</option>
      <option value="PriceLowToHigh">Price: Low to High</option>
      <option value="PriceHighToLow">Price: High to Low</option>
      <option value="Rating">Rating</option>
    </select>
  </div>
</div>
