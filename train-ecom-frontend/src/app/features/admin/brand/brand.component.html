<div class="container mt-4">
  <div class="d-flex justify-content-between align-item-center mb-4">
    <h2 class="text-primary m-0">Brand Management</h2>
    <button class="btn btn-danger" (click)="openBrandDialog()">
      <mat-icon>add</mat-icon>
      Add New Brand
    </button>
  </div>

  <div *ngIf="isLoading" class="text-center p-5">
    <mat-spinner diameter="40" class="mx-auto"></mat-spinner>
    <p class="mt-2 text-muted">Loading brands...</p>
  </div>
  
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <table mat-table [dataSource]="brands" class="mat-elevation-z0 w-100">
        <ng-container matColumnDef="sno">
          <th mat-header-cell *matHeaderCellDef>S. No</th>
          <td mat-cell *matCellDef="let brand; let i = index">
            {{ i + 1 }}
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Brand Name</th>
          <td mat-cell *matCellDef="let brand">
            <strong>{{ brand.name }}</strong>
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let brand">{{ brand.description }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-end">Actions</th>
          <td mat-cell *matCellDef="let brand" class="text-end">
            <button
              mat-icon-button
              color="primary"
              (click)="openBrandDialog(brand)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              (click)="deleteBrand(brand.id)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="['sno', 'name', 'description', 'actions']"
        ></tr>
        <tr
          mat-row
          *matRowDef="
            let row;
            columns: ['sno', 'name', 'description', 'actions']
          "
        ></tr>
      </table>
      <div *ngIf="brands.length === 0" class="p-4 text-center text-muted">
        No brands found.
      </div>
    </div>
  </div>
</div>
