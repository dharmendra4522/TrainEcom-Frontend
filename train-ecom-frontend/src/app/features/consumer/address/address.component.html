<div class="address-container">

    <div class="address-header">
        <h2>My Addresses</h2>
        <button mat-flat-button color="primary" (click)="openAddAddressDialog()">
            Add New Address
        </button>
    </div>

    <div *ngIf="isLoading" class="loading">Loading addresses...</div>

    <div *ngIf="!isLoading && addresses.length > 0" class="address-list">
        <div *ngFor="let addr of addresses" class="address-card">
            <h3>{{ addr.fullName }}</h3>
            <p>{{ addr.addressLine1 }}{{ addr.addressLine2 ? ', ' + addr.addressLine2 : '' }}</p>
            <p>{{ addr.city }}, {{ addr.state }} - {{ addr.postalCode }}</p>
            <p>Phone: {{ addr.phone }}</p>
            <span *ngIf="addr.isDefault" class="default-badge">Default</span>

            <div class="card-actions">
                <button mat-button color="primary" (click)="editAddress(addr)">Edit</button>
                <button mat-button color="warn" (click)="deleteAddress(addr.id)">Delete</button>
            </div>
        </div>
    </div>

    <div *ngIf="!isLoading && addresses.length === 0" class="empty-state">
        <p>No addresses found. Please add a new address.</p>
    </div>
</div>
