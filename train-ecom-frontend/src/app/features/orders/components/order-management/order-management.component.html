<div class="container-fluid mt-2 px-0">
  <div class="sticky-top-section">
    <!-- Page Header -->
    <div class="row align-items-center justify-content-between mb-4 g-3">
      <div class="col-12 col-md-6">
        <h2 class="fs-4 fw-bold text-dark m-0">Order Management</h2>
        <p class="text-muted small m-0">View and manage all customer orders.</p>
      </div>

      <!-- Search Section -->
      <div class="col-12 col-md-4" [formGroup]="filterForm">
        <mat-form-field
          appearance="outline"
          class="compact-order-field w-100 mb-0"
          subscriptSizing="dynamic"
          floatLabel="always"
        >
          <mat-label>Search Order</mat-label>
          <mat-icon matPrefix class="text-secondary">search</mat-icon>
          <input
            matInput
            formControlName="search"
            placeholder="Search name or ID..."
          />
          <button
            *ngIf="searchQuery"
            mat-icon-button
            matSuffix
            type="button"
            color="warn"
            aria-label="Clear order search"
            title="Clear search"
            (click)="resetFilters()"
          >
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </div>
    </div>
  </div>

  <!-- Orders Table -->
  <app-generic-table
    [data]="orders"
    [columns]="columns"
    [showIndex]="false"
    [isLoading]="isLoading"
    [showPaginator]="false"
    [totalRecords]="totalRecords"
    (loadMore)="onTableScroll()"
    emptyMessage="No orders found matching the filter criteria."
    (rowClick)="navigateToOrderDetails($event)"
    [showheaderFilter]="showFilterHeader"
    [dropdownOptionsMap]="dropdownOptionsMap"
    [dropdownLoadingMap]="dropdownLoadingMap"
    [selectedFiltersMap]="selectedFiltersMap"
    [rangeBoundsMap]="rangeBoundsMap"
    [selectedRangesMap]="selectedRangesMap"
    [filterResetToken]="filterResetToken"
    (dropdownSelectionChange)="onDropdownSelectionChanged($event)"
    (filterApply)="onFilterApply($event)"
    (filterClear)="onFilterClear($event)"
    (filterChanged)="onTableFilterChanged($event)"
    (priceRangeChange)="onRangeFilterChanged($event)"
    (dateFilterChange)="onDateFilterChanged($event)"
  >
  </app-generic-table>
</div>
