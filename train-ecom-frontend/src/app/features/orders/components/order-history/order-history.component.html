<div class="container py-3 px-2 px-sm-3">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">

            <!-- Title & Search Bar Header -->
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 gap-sm-3 mb-3 mb-sm-4">
                <h2 class="fw-bold text-dark m-0 fs-4 fs-sm-2">Order History</h2>

                <div class="input-group w-100 search-input-group">
                    <input type="text" class="form-control border-end-0 shadow-none py-2 px-3 fs-7 fs-sm-6"
                        placeholder="Search by Order ID or Name..." [(ngModel)]="searchQuery"
                        aria-label="Search orders">
                    <button class="btn btn-primary d-flex align-items-center justify-content-center gap-1 px-3 flex-shrink-0" type="button">
                        <mat-icon style="font-size: 18px; width: 18px; height: 18px;">search</mat-icon>
                        <span class="d-none d-sm-inline">Search</span>
                    </button>
                </div>
            </div>

            <!-- Empty Orders State -->
            <div *ngIf="orderHistory.length === 0" class="text-center py-5 bg-white rounded-4 shadow-sm px-3">
                <mat-icon class="fs-1 text-secondary mb-2" style="width: 48px; height: 48px;">receipt_long</mat-icon>
                <p class="fw-semibold text-secondary mb-0">No orders found.</p>
            </div>

            <!-- Order Cards List -->
            <div *ngFor="let order of filteredOrders | slice:0:displayLimit"
                class="card mb-2 mb-sm-3 shadow-sm border-0 rounded-3 rounded-sm-4 bg-white overflow-hidden order-card"
                (click)="navigateToOrderDetails(order.orderId)" style="cursor: pointer;">
                <div class="card-body p-2 p-sm-3 p-md-4">
                    <div class="d-flex align-items-start align-items-sm-center gap-2 gap-sm-3">

                        <!-- Thumbnail Image -->
                        <div class="flex-shrink-0">
                            <div class="ratio ratio-1x1 bg-light rounded-2 rounded-sm-3 overflow-hidden border order-thumb">
                                <img [src]="getImageUrl(order.thumbnailUrl) || 'assets/placeholder.jpg'"
                                    appImgFallback
                                    [alt]="order.orderName || 'Order Item'" class="object-fit-cover w-100 h-100">
                            </div>
                        </div>

                        <!-- Order Info & Price -->
                        <div class="flex-grow-1 min-w-0">

                            <!-- Top row inside info: Title & Total Amount -->
                            <div class="d-flex align-items-start justify-content-between gap-2 mb-1">
                                <h6 class="fw-bold text-dark mb-0 text-truncate order-title me-1" [title]="order.orderName">{{ order.orderName }}</h6>
                                <div class="fw-bold text-dark fs-6 fs-sm-5 text-nowrap flex-shrink-0">₹{{ order.totalAmount | number:'1.2-2' }}</div>
                            </div>

                            <!-- Bottom row inside info: Status Badge, Items Count, & Date -->
                            <div class="d-flex align-items-center justify-content-between flex-wrap gap-1 mt-1">
                                <div class="d-flex align-items-center gap-1 gap-sm-2 flex-wrap">
                                    <span class="badge px-2 py-1 rounded-pill small fw-semibold" [ngClass]="getOrdertatusClass(order.orderStatus)">
                                        {{ order.orderStatus }}
                                    </span>
                                    <span class="text-muted small fs-7">Items: {{ order.totalItems }}</span>
                                </div>

                                <span class="text-secondary small fs-7 ms-auto text-nowrap">
                                    Ordered: {{ order.orderDate | date:'mediumDate' }}
                                </span>
                            </div>

                        </div>

                    </div>
                </div>
            </div>

            <!-- View More Button -->
            <div class="text-center mt-3 mt-sm-4 mb-3" *ngIf="orderHistory.length > displayLimit">
                <button mat-stroked-button color="primary" class="px-4 px-sm-5 py-2 rounded-pill fw-semibold"
                    (click)="showMoreOrders()">
                    <mat-icon>expand_more</mat-icon>
                    View More Orders
                </button>
            </div>

        </div>
    </div>
</div>
