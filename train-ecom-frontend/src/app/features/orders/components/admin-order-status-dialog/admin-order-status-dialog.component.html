<h2 mat-dialog-title class="fw-bold text-dark border-bottom pb-3 mb-4">
  Update Order Status
</h2>

<mat-dialog-content class="mat-typography mb-4 admin-status-dialog-content">
  <form [formGroup]="form" class="d-flex flex-column gap-3 admin-status-form">
    <p class="m-0 small text-secondary">
      Current Status:
      <span class="fw-semibold text-dark">{{ currentStatusLabel }}</span>
    </p>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Order Status</mat-label>
      <mat-select formControlName="status" required>
        <mat-option *ngFor="let status of statuses" [value]="status.value" [disabled]="isStatusDisabled(status.value)">
          {{ status.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Update Message / Remarks (Optional)</mat-label>
      <textarea
        matInput
        formControlName="remark"
        rows="3"
        placeholder="Enter remarks for status update"
      ></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions
  align="end"
  class="border-top pt-3 pb-2 pe-2 admin-status-actions"
>
  <button
    mat-stroked-button
    color="warn"
    (click)="onCancel()"
    [disabled]="isUpdating"
    class="px-4 py-2 rounded-3 me-2"
  >
    Cancel
  </button>

  <button
    mat-flat-button
    color="primary"
    (click)="onSubmit()"
    [disabled]="form.invalid || isUpdating"
    class="px-4 py-2 rounded-3"
  >
    <mat-spinner
      *ngIf="isUpdating"
      diameter="20"
      class="me-2 d-inline-block align-middle"
    ></mat-spinner>
    Update Status
  </button>
</mat-dialog-actions>
