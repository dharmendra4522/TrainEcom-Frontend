<div aria-label="Breadcrumb" class="min-w-0 me-3 mb-3">
    <ol class="breadcrumb bg-transparent p-0 mb-0 flex-wrap overflow-hidden">
        <li *ngFor="let item of items; let last = last" class="breadcrumb-item flex-shrink-0" [class.active]="last"
            [class.text-dark]="last" [class.fw-semibold]="last" [attr.aria-current]="last ? 'page' : null">
            
            <a *ngIf="!last && item.url; else testOnly" [routerLink]="item.url" class="text-decoration-none text-muted">
                {{ item.label }}
            </a>
            
            <ng-template #testOnly>
                <span class="text-truncate">{{ item.label }}</span>
            </ng-template>
        </li>
    </ol>
</div>
