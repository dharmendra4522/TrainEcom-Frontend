<div
  class="generic-table-card card border-0 shadow-sm rounded-4 overflow-hidden bg-white position-relative"
>
  <div
    class="progress-bar"
  >
    <mat-progress-bar
      *ngIf="isLoading"
      mode="indeterminate"
      class="progress-bar"
    ></mat-progress-bar>
  </div>

  <div
    class="table-scroll-container position-relative"
    (scroll)="onTableScroll($event)"
  >
    <table
      mat-table
      [dataSource]="data"
      class="custom-mat-table w-100"
      matSort
      (matSortChange)="onSortData($event)"
    >
      <ng-container matColumnDef="sno" *ngIf="showIndex">
        <th
          mat-header-cell
          mat-sort-header="sno"
          sortActionDescription
          *matHeaderCellDef
          class="px-4 py-3 fw-bold text-uppercase text-secondary fs-7"
        >
          #
        </th>
        <td
          mat-cell
          *matCellDef="let row; let i = index"
          class="px-4 py-3  fw-bold text-secondary font-monospace"
        >
          {{ row['sno'] }}
        </td>
      </ng-container>

      <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
        <th
          mat-header-cell
          [mat-sort-header]="col.key"
          [disabled]="col.sortable === false"
          *matHeaderCellDef
          class="px-4 py-3 fw-bold text-uppercase text-secondary fs-7"
        >
          {{ col.label }}
        </th>
        <td
          id="table-data"
          mat-cell
          *matCellDef="let row"
          class="px-4 py-3 text-dark"
        >
          <div
            *ngIf="
              !col.type ||
              col.type === 'text' ||
              col.type === 'string' ||
              col.type === 'number'
            "
            class="fw-medium"
            [class.text-truncate-clamp]="
              col.truncate ||
              col.key === 'description' ||
              col.key === 'title' ||
              col.key === 'name'
            "
            [matTooltip]="
              (col.truncate ||
                col.key === 'description' ||
                col.key === 'title' ||
                col.key === 'name') &&
              row[col.key]
                ? row[col.key] + ''
                : null
            "
            matTooltipPosition="below"
          >
            {{ row[col.key] || "N/A" }}
          </div>

          <div
            *ngIf="col.type === 'image'"
            class="image-thumb-wrapper rounded-3 overflow-hidden border"
          >
            <img
              *ngIf="row[col.key]"
              [src]="row[col.key]"
              [alt]="col.label"
              appImgFallback
              class="table-img img-fluid"
            />
            <span *ngIf="!row[col.key]" class="text-muted small px-2"
              >No Image</span
            >
          </div>

          <span
            *ngIf="col.type === 'currency'"
            class="fw-bold text-primary fs-6"
          >
            ₹{{ row[col.key] | number: "1.2-2" }}
          </span>

          <span *ngIf="col.type === 'date'" class="fw-medium text-secondary">
            {{ (row[col.key] | date: "mediumDate") || "N/A" }}
          </span>

          <span
            *ngIf="col.type === 'badge'"
            class="badge fw-semibold px-3 py-2 rounded-pill"
            [ngClass]="
              col.badgeClassKey && row[col.badgeClassKey]
                ? row[col.badgeClassKey]
                : 'bg-primary-subtle text-primary'
            "
            [matTooltip]="row['rejectionReason'] ? row['rejectionReason'] + '' : ''"
            [matTooltipDisabled]="!row['rejectionReason']"
          >
            {{ row[col.key] || "General" }}
          </span>
        </td>
      </ng-container>

      <ng-container
        matColumnDef="actions"
        *ngIf="actions && actions.length > 0"
      >
        <th
          mat-header-cell
          *matHeaderCellDef
          class="px-4 py-3 fw-bold text-uppercase text-secondary fs-7 text-end"
        >
          Actions
        </th>
        <td mat-cell *matCellDef="let row" class="px-4 py-3 text-end">
          <div
            class="d-inline-flex justify-content-end align-items-center gap-1"
          >
            <ng-container *ngIf="showInlineActions; else actionMenu">
              <ng-container *ngFor="let act of actions">
                <button
                  *ngIf="!act.hideWhenDisabled || !isActionDisabled(act, row)"
                  mat-icon-button
                  [color]="getActionColor(act, row)"
                  [disabled]="isActionDisabled(act, row)"
                  class="action-btn"
                  [matTooltip]="getActionLabel(act, row) | titlecase"
                  (click)="onActionClick(act.actionKey, row)"
                >
                  <mat-icon>{{ getActionIcon(act, row) }}</mat-icon>
                </button>
              </ng-container>
            </ng-container>

            <ng-template #actionMenu>
              <button
                mat-icon-button
                [matMenuTriggerFor]="tableActionMenu"
                class="action-btn"
                matTooltip="More Actions"
              >
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #tableActionMenu="matMenu" xPosition="before">
                <ng-container *ngFor="let act of actions">
                  <button
                    *ngIf="!act.hideWhenDisabled || !isActionDisabled(act, row)"
                    mat-menu-item
                    [disabled]="isActionDisabled(act, row)"
                    (click)="onActionClick(act.actionKey, row)"
                  >
                    <mat-icon *ngIf="act.icon" [ngClass]="{
                      'text-danger': act.color === 'warn',
                      'text-primary': act.color === 'primary',
                      'text-accent': act.color === 'accent'
                    }">{{ getActionIcon(act, row) }}</mat-icon>
                    <span [ngClass]="{
                      'text-danger': act.color === 'warn',
                      'text-primary': act.color === 'primary',
                      'text-accent': act.color === 'accent'
                    }">{{ getActionLabel(act, row) | titlecase }}</span>
                  </button>
                </ng-container>
              </mat-menu>
            </ng-template>
          </div>
        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns; sticky: true"
        class="bg-light-subtle border-bottom"
      ></tr>
<tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        (click)="onRowClick(row, $event)"
        [class.table-row-hover]="enableRowClick"
        [class.cursor-pointer]="enableRowClick"
        [class.cursor-default]="!enableRowClick"
      ></tr>
    </table>

    <div
      *ngIf="!data || data.length === 0"
      class="empty-state-container text-center py-5 px-4"
    >
      <div
        class="empty-icon-circle mx-auto mb-3 d-flex align-items-center justify-content-center bg-light rounded-circle text-muted"
      >
        <mat-icon class="fs-2">inbox</mat-icon>
      </div>
      <h6 class="fw-bold text-dark mb-1">No Data Available</h6>
      <p class="text-secondary small mb-0">{{ emptyMessage }}</p>
    </div>
  </div>

  <mat-paginator
    *ngIf="showPaginator"
    [length]="totalRecords"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPageChange($event)"
    showFirstLastButtons
    class="border-top"
  >
  </mat-paginator>
</div>
