<div
  class="generic-table-card card border-0 shadow-sm rounded-4 overflow-hidden bg-white position-relative"
>
  <div class="progress-bar">
    <mat-progress-bar
      *ngIf="isLoading"
      mode="indeterminate"
      class="progress-bar"
    ></mat-progress-bar>
  </div>

  <div
    class="table-scroll-container position-relative"
    (scroll)="onTableScroll($event)"
  >
    <table
      mat-table
      [dataSource]="data"
      class="custom-mat-table w-100"
      matSort
      (matSortChange)="onSortData($event)"
    >
      <!-- Seial number -->
      <ng-container matColumnDef="sno" *ngIf="showIndex">
        <th mat-header-cell *matHeaderCellDef class="p-0 border-0">
          <div class="d-flex flex-column w-100">
            <!-- Filter Space / Empty Box -->
            <div
              class="px-4 py-2 bg-white border-bottom"
              *ngIf="showheaderFilter"
            >
              <div class="filter-header"></div>
            </div>
            <div
              class="px-4 py-3 fw-bold text-uppercase text-secondary fs-7 bg-light-subtle"
            >
              #
            </div>
          </div>
        </th>
        <td
          mat-cell
          *matCellDef="let row; let i = index"
          class="px-4 py-3 fw-bold text-secondary font-monospace"
        >
          {{ row["sno"] }}
        </td>
      </ng-container>

      <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="p-0 border-0"
          [class.filter-column-header]="showheaderFilter && col.filterable"
          [class.dropdown-filter-header]="
            showheaderFilter &&
            (col.filterType === 'dropdown' ||
              col.filterType === 'price-range' ||
              col.filterType === 'stock-range')
          "
        >
          <div class="d-flex flex-column w-100 position-relative">
            <!-- Top Row Filter Input -->
            <div
              class="px-4 py-2 bg-white border-bottom"
              [class.dropdown-filter-space]="
                col.filterType === 'dropdown' ||
                col.filterType === 'price-range' ||
                col.filterType === 'stock-range'
              "
              *ngIf="showheaderFilter"
            >
              <div *ngIf="col.filterable" class="position-relative w-100">
                <ng-container
                  *ngIf="
                    col.filterType === 'dropdown' ||
                      col.filterType === 'price-range' ||
                      col.filterType === 'stock-range';
                    else dateFilter
                  "
                >
                  <mat-form-field
                    appearance="outline"
                    subscriptSizing="dynamic"
                    class="compact-filter-field w-100 filter-select-field"
                    [class.disabled-filter-element]="col.filterDisabled"
                    #trigger="cdkOverlayOrigin"
                    cdkOverlayOrigin
                    (click)="toggleDropdown(col.key, $event)"
                  >
                    <input
                      matInput
                      readonly
                      class="filter-select-input"
                      [disabled]="col.filterDisabled"
                      [placeholder]="col.label"
                      [value]="getSelectedFilterLabel(col.key)"
                      (click)="
                        $event.stopPropagation();
                        toggleDropdown(col.key, $event)
                      "
                    />
                    <span matSuffix class="filter-select-suffix">
                      <span
                        *ngIf="getSelectedCount(col.key) > 0"
                        class="badge bg-primary rounded-pill filter-select-count"
                      >
                        {{ getSelectedCount(col.key) }}
                      </span>
                      <mat-icon class="text-muted drop-icon">
                        arrow_drop_down
                      </mat-icon>
                    </span>
                  </mat-form-field>

                  <ng-template
                    cdkConnectedOverlay
                    [cdkConnectedOverlayOrigin]="trigger"
                    [cdkConnectedOverlayOpen]="activeDropdownCol === col.key"
                      [cdkConnectedOverlayPanelClass]="
                      'custom-multiselect-overlay'
                    "
                    (overlayOutsideClick)="activeDropdownCol = null"
                  >
                    <div class="shadow-sm rounded-3 bg-white mt-1">
                      <app-multiselect-dropdown
                        [canApply]="canApply(col.key)"
                        [canClear]="canClear(col.key)"
                        [isPriceRange]="col.filterType === 'price-range'"
                        [isStockRange]="col.filterType === 'stock-range'"
                        [priceMin]="getRangeBounds(col.key).min"
                        [priceMax]="getRangeBounds(col.key).max"
                        [stockMin]="getRangeBounds(col.key).min"
                        [stockMax]="getRangeBounds(col.key).max"
                        [selectedRange]="getSelectedRange(col.key)"
                        [resetToken]="filterResetToken"
                        [options]="getDropdownOptions(col.key)"
                        [isLoading]="isDropdownLoading(col.key)"
                        [selectedValues]="getSelectedValues(col.key)"
                        (searchChange)="onDropdownSearch(col.key, $event)"
                        (selectionChange)="
                          onDropdownSelectionChange(col.key, $event)
                        "
                        (applyFilters)="onDropdownApply(col.key)"
                        (clearFilters)="onDropdownClear(col.key)"
                        (scrollToBottom)="onDropdownScroll(col.key)"
                        (priceRangeChange)="onPriceRangeChange(col.key, $event)"
                        (stockRangeChange)="onStockRangeChange(col.key, $event)"
                      ></app-multiselect-dropdown>
                    </div>
                  </ng-template>
                </ng-container>

                <!-- Date Filter Type -->
                <ng-template #dateFilter>
                  <ng-container
                    *ngIf="col.filterType === 'date'; else searchInput"
                  >
                    <mat-form-field
                      appearance="outline"
                      subscriptSizing="dynamic"
                      class="compact-filter-field w-100"
                    >
                      <input
                        matInput
                        [matDatepicker]="datePicker"
                        placeholder="Date"
                        [value]="getDateFilterValue(col.key)"
                        (dateChange)="onDateFilterChange(col.key, $event.value)"
                        (click)="datePicker.open(); $event.stopPropagation()"
                      />
                      <button
                        *ngIf="filterValues[col.key]"
                        mat-icon-button
                        matSuffix
                        type="button"
                        class="compact-filter-icon"
                        aria-label="Clear date filter"
                        (click)="clearDateFilter(col.key, $event)"
                      >
                        <mat-icon>close</mat-icon>
                      </button>
                      <mat-datepicker-toggle
                        *ngIf="!filterValues[col.key]"
                        matSuffix
                        [for]="datePicker"
                        class="compact-datepicker-toggle"
                        (click)="$event.stopPropagation()"
                      ></mat-datepicker-toggle>
                      <mat-datepicker #datePicker></mat-datepicker>
                    </mat-form-field>
                  </ng-container>
                </ng-template>

                <!-- search input default -->
                <ng-template #searchInput>
                  <mat-form-field
                    appearance="outline"
                    subscriptSizing="dynamic"
                    class="compact-filter-field w-100"
                  >
                    <input
                      #colInput
                      matInput
                      type="text"
                      [class.disabled-filter-element]="col.filterDisabled"
                      [disabled]="col.filterDisabled"
                      [placeholder]="col.label"
                      [value]="filterValues[col.key] || ''"
                      (input)="onSearchInput(col.key, $event)"
                      (click)="$event.stopPropagation()"
                    />
                    <button
                      mat-icon-button
                      matSuffix
                      type="button"
                      class="compact-filter-icon"
                      [class.filter-clear-hidden]="!filterValues[col.key]"
                      [disabled]="!filterValues[col.key]"
                      aria-label="Clear search"
                      (click)="
                        clearSearchInput(col.key, colInput);
                        $event.stopPropagation()
                      "
                    >
                      <mat-icon>close</mat-icon>
                    </button>
                  </mat-form-field>
                </ng-template>
              </div>
              <div class="filter-header" *ngIf="!col.filterable"></div>
            </div>

            <!-- Actual Sort Header & Label -->
            <div
              class="px-4 py-3 fw-bold text-uppercase text-secondary fs-7 bg-light-subtle sort-header-container text-nowrap"
              mat-sort-header="{{ col.key }}"
              [disabled]="col.sortable === false"
            >
              {{ col.label }}
            </div>
          </div>
        </th>

        <!-- table data -->
        <td
          id="table-data"
          mat-cell
          *matCellDef="let row"
          class="px-4 py-3 text-dark"
        >
          <div
            *ngIf="
              !col.type ||
              col.type === 'text' ||
              col.type === 'string' ||
              col.type === 'number'
            "
            class="fw-medium"
            [class.text-truncate-clamp]="
              col.truncate ||
              col.key === 'description' ||
              col.key === 'title' ||
              col.key === 'name'
            "
            [matTooltip]="
              (col.truncate ||
                col.key === 'description' ||
                col.key === 'title' ||
                col.key === 'name') &&
              row[col.key]
                ? row[col.key] + ''
                : null
            "
            matTooltipPosition="below"
          >
            {{ row[col.key] || "N/A" }}
          </div>

          <div
            *ngIf="col.type === 'image'"
            class="image-thumb-wrapper rounded-3 overflow-hidden border"
          >
            <img
              *ngIf="row[col.key]"
              [src]="row[col.key]"
              [alt]="col.label"
              appImgFallback
              class="table-img img-fluid"
            />
            <span *ngIf="!row[col.key]" class="text-muted small px-2"
              >No Image</span
            >
          </div>

          <span *ngIf="col.type === 'currency'" class="fw-medium text-dark">
            ₹{{ row[col.key] | number: "1.2-2" }}
          </span>

          <span *ngIf="col.type === 'date'" class="fw-medium text-secondary">
            {{ (row[col.key] | date: "mediumDate") || "N/A" }}
          </span>

          <span
            *ngIf="col.type === 'badge'"
            class="badge fw-semibold px-3 py-2 rounded-pill"
            [ngClass]="
              col.badgeClassKey && row[col.badgeClassKey]
                ? row[col.badgeClassKey]
                : 'bg-primary-subtle text-primary'
            "
            [matTooltip]="
              row['rejectionReason'] ? row['rejectionReason'] + '' : ''
            "
            [matTooltipDisabled]="!row['rejectionReason']"
          >
            {{ row[col.key] || "General" }}
          </span>
        </td>
      </ng-container>

      <!-- action column -->
      <ng-container
        matColumnDef="actions"
        *ngIf="actions && actions.length > 0"
      >
        <th mat-header-cell *matHeaderCellDef class="p-0 border-0">
          <div class="d-flex flex-column w-100">
            <!-- Empty filter space to align with the other column headers -->
            <div
              class="px-4 py-2 bg-white border-bottom"
              *ngIf="showheaderFilter"
            >
              <div class="filter-header"></div>
            </div>
            <!-- Bottom Row Header Name -->
            <div
              class="px-4 py-3 fw-bold text-uppercase text-secondary fs-7 text-end text-nowrap bg-light-subtle"
            >
              Actions
            </div>
          </div>
        </th>
        <td mat-cell *matCellDef="let row" class="px-4 py-3 text-end">
          <div
            class="d-inline-flex justify-content-end align-items-center gap-1"
          >
            <ng-container *ngIf="showInlineActions; else actionMenu">
              <ng-container *ngFor="let act of actions">
                <button
                  *ngIf="!act.hideWhenDisabled || !isActionDisabled(act, row)"
                  mat-icon-button
                  [color]="getActionColor(act, row)"
                  [disabled]="isActionDisabled(act, row)"
                  class="action-btn"
                  [matTooltip]="getActionLabel(act, row) | titlecase"
                  (click)="onActionClick(act.actionKey, row)"
                >
                  <mat-icon>{{ getActionIcon(act, row) }}</mat-icon>
                </button>
              </ng-container>
            </ng-container>

            <ng-template #actionMenu>
              <button
                mat-icon-button
                [matMenuTriggerFor]="tableActionMenu"
                class="action-btn"
                matTooltip="More Actions"
              >
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #tableActionMenu="matMenu" xPosition="before">
                <ng-container *ngFor="let act of actions">
                  <button
                    *ngIf="!act.hideWhenDisabled || !isActionDisabled(act, row)"
                    mat-menu-item
                    [disabled]="isActionDisabled(act, row)"
                    (click)="onActionClick(act.actionKey, row)"
                  >
                    <mat-icon
                      *ngIf="act.icon"
                      [ngClass]="{
                        'text-danger': act.color === 'warn',
                        'text-primary': act.color === 'primary',
                        'text-accent': act.color === 'accent'
                      }"
                      >{{ getActionIcon(act, row) }}</mat-icon
                    >
                    <span
                      [ngClass]="{
                        'text-danger': act.color === 'warn',
                        'text-primary': act.color === 'primary',
                        'text-accent': act.color === 'accent'
                      }"
                      >{{ getActionLabel(act, row) | titlecase }}</span
                    >
                  </button>
                </ng-container>
              </mat-menu>
            </ng-template>
          </div>
        </td>
      </ng-container>

      <tr
        mat-header-cell
        mat-header-row
        *matHeaderRowDef="displayedColumns; sticky: true"
        class="border-bottom p-0"
      ></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        (click)="onRowClick(row, $event)"
        [class.table-row-hover]="enableRowClick"
        [class.cursor-pointer]="enableRowClick"
        [class.cursor-default]="!enableRowClick"
      ></tr>
    </table>

    <div
      *ngIf="!data || data.length === 0"
      class="empty-state-container text-center py-5 px-4"
    >
      <div
        class="empty-icon-circle mx-auto mb-3 d-flex align-items-center justify-content-center bg-light rounded-circle text-muted"
      >
        <mat-icon class="fs-2">inbox</mat-icon>
      </div>
      <h6 class="fw-bold text-dark mb-1">No Data Available</h6>
      <p class="text-secondary small mb-0">{{ emptyMessage }}</p>
    </div>
  </div>

  <mat-paginator
    *ngIf="showPaginator"
    [length]="totalRecords"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPageChange($event)"
    showFirstLastButtons
    class="border-top"
  >
  </mat-paginator>
</div>
