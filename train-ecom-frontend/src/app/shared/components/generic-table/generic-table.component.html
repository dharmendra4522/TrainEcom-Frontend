<div class="generic-table-card card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
  <div class="table-responsive position-relative">

    <mat-progress-bar *ngIf="isLoading" mode="indeterminate" class="position-absolute top-0 start-0 w-100"
      style="height: 3px; z-index: 100;"></mat-progress-bar>

    <table mat-table [dataSource]="data" class="custom-mat-table w-100">

      <ng-container matColumnDef="sno" *ngIf="showIndex">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-3 fw-bold text-uppercase text-secondary fs-7">#</th>
        <td mat-cell *matCellDef="let row; let i = index" class="px-4 py-3 text-secondary font-monospace">
          {{ i + 1 }}
        </td>
      </ng-container>

      <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-3 fw-bold text-uppercase text-secondary fs-7">
          {{ col.label }}
        </th>
        <td mat-cell *matCellDef="let row" class="px-4 py-3 text-dark">
          <div *ngIf="!col.type || col.type === 'text'" class="fw-medium"
            [class.text-truncate-clamp]="col.truncate || col.key === 'description' || col.key === 'title' || col.key === 'name'"
            [matTooltip]="(col.truncate || col.key === 'description' || col.key === 'title' || col.key === 'name') && row[col.key] ? row[col.key] + '' : null" matTooltipPosition="below">
            {{ row[col.key] || 'N/A' }}
          </div>

          <div *ngIf="col.type === 'image'" class="image-thumb-wrapper rounded-3 overflow-hidden border">
            <img *ngIf="row[col.key]" [src]="row[col.key]" [alt]="col.label" class="table-img img-fluid">
            <span *ngIf="!row[col.key]" class="text-muted small px-2">No Image</span>
          </div>

          <span *ngIf="col.type === 'currency'" class="fw-bold text-primary fs-6">
            ₹{{ row[col.key] | number:'1.2-2' }}
          </span>

          <span *ngIf="col.type === 'badge'"
            class="badge bg-primary-subtle text-primary fw-semibold px-3 py-2 rounded-pill">
            {{ row[col.key] || 'General' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions" *ngIf="actions && actions.length > 0">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-3 fw-bold text-uppercase text-secondary fs-7 text-end">
          Actions
        </th>
        <td mat-cell *matCellDef="let row" class="px-4 py-3 text-end">
          <div class="d-inline-flex justify-content-end align-items-center gap-1">
            <ng-container *ngIf="showInlineActions; else actionMenu">
              <button *ngFor="let act of actions" mat-icon-button [color]="act.color" class="action-btn"
                [matTooltip]="act.tooltip || (act.actionKey | titlecase)" (click)="onActionClick(act.actionKey, row)">
                <mat-icon>{{ act.icon }}</mat-icon>
              </button>
            </ng-container>

            <ng-template #actionMenu>
              <button mat-icon-button [matMenuTriggerFor]="tableActionMenu" class="action-btn" matTooltip="More Actions">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #tableActionMenu="matMenu" xPosition="before">
                <button *ngFor="let act of actions" mat-menu-item (click)="onActionClick(act.actionKey, row)">
                  <mat-icon *ngIf="act.icon">{{ act.icon }}</mat-icon>
                  <span>{{ act.tooltip || act.actionKey | titlecase }}</span>
                </button>
              </mat-menu>
            </ng-template>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-light-subtle border-bottom"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="onRowClick(row, $event)"
        class="table-row-hover transition-all cursor-pointer"></tr>
    </table>

    <div *ngIf="!isLoading && (!data || data.length === 0)" class="empty-state-container text-center py-5 px-4">
      <div
        class="empty-icon-circle mx-auto mb-3 d-flex align-items-center justify-content-center bg-light rounded-circle text-muted">
        <mat-icon class="fs-2">inbox</mat-icon>
      </div>
      <h6 class="fw-bold text-dark mb-1">No Data Available</h6>
      <p class="text-secondary small mb-0">{{ emptyMessage }}</p>
    </div>

    <mat-paginator *ngIf="!isLoading && showPaginator" [length]="totalRecords" [pageSize]="pageSize"
      [pageIndex]="pageIndex" [pageSizeOptions]="pageSizeOptions" (page)="onPageChange($event)" showFirstLastButtons
      class="border-top">
    </mat-paginator>
  </div>
</div>
