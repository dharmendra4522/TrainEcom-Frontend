<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
    <form [formGroup]="dynamicForm" class="dialog-form">

        <ng-container *ngFor="let field of data.fields">

            <mat-form-field *ngIf="field.type !== 'checkbox'" appearance="outline" class="full-width">
                <mat-label>{{ field.label }}</mat-label>
                <input matInput [type]="field.type" [formControlName]="field.key">
            </mat-form-field>

            <mat-checkbox *ngIf="field.type === 'checkbox'" [formControlName]="field.key" color="primary">
                {{ field.label }}
            </mat-checkbox>

        </ng-container>

    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="dynamicForm.invalid">
        {{ data.submitButtonText }}
    </button>
</mat-dialog-actions>
