<div class="modal-header premium-header px-4 py-3 mb-3 justify-content-center ">
    <h3 mat-dialog-title class="mb-0 fw-bold text-white fs-4  w-100 mt-3">{{ data.title }}</h3>
</div>

<mat-dialog-content class="px-4 py-3">
    <button
        *ngIf="data.enableCurrentLocation"
        mat-stroked-button
        color="primary"
        type="button"
        class="mb-3"
        [disabled]="isLoadingLocation"
        (click)="getCurrentLocation()"
    >
        <mat-icon>{{ isLoadingLocation ? 'autorenew' : 'my_location' }}</mat-icon>
        {{ isLoadingLocation ? 'Fetching Location...' : 'Use Current Location' }}
    </button>

    <form [formGroup]="dynamicForm" class="dialog-form ">

        <ng-container *ngFor="let field of data.fields">

            <mat-form-field *ngIf="field.type !== 'checkbox'" appearance="outline"
                [ngClass]="(field.key === 'country' || field.key === 'state' || field.key === 'city' || field.key === 'postalCode') ? 'half-width' : 'full-width'">
                <mat-label>{{ field.label }}</mat-label>
                <span matPrefix *ngIf="field.key === 'phone' || field.key === 'phoneNumber'" class="text-secondary fw-semibold ps-2 pe-1">+91</span>
                <mat-select
                    *ngIf="field.type === 'select'"
                    [formControlName]="field.key"
                    (selectionChange)="
                        field.key === 'country'
                            ? onCountryChange($event.value)
                            : field.key === 'state'
                                ? onStateChange($event.value)
                                : null
                    ">
                    <ng-container *ngIf="field.key === 'country'">
                        <mat-option *ngFor="let country of countries" [value]="country.name">
                            {{ country.name }}
                        </mat-option>
                    </ng-container>
                    <ng-container *ngIf="field.key === 'state'">
                        <mat-option *ngFor="let state of states" [value]="state.name">
                            {{ state.name }}
                        </mat-option>
                    </ng-container>
                    <ng-container *ngIf="field.key === 'city'">
                        <mat-option *ngFor="let city of cities" [value]="city.name">
                            {{ city.name }}
                        </mat-option>
                    </ng-container>
                    <ng-container *ngIf="field.key !== 'country' && field.key !== 'state' && field.key !== 'city'">
                        <mat-option *ngFor="let option of field.options || []" [value]="option.value">
                            {{ option.label }}
                        </mat-option>
                    </ng-container>
                </mat-select>
                <input *ngIf="field.type !== 'select'" matInput [type]="field.type" [formControlName]="field.key"
                    [attr.maxLength]="field.maxLength ? field.maxLength : null"
                    (blur)="trimControlValue(field.key)">

                <mat-error>
                    {{ getFieldError(field.key, field.label) }}
                </mat-error>

            </mat-form-field>

            <mat-checkbox *ngIf="field.type === 'checkbox'" [formControlName]="field.key" color="primary">
                {{ field.label }}
            </mat-checkbox>

        </ng-container>

    </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="px-4 pb-3">
    <button mat-button mat-dialog-close class="text-secondary fw-medium">Cancel</button>

    <button mat-flat-button color="primary" 
            class="shadow-sm px-4 fw-bold rounded-pill" 
            (click)="onSubmit()" [disabled]="dynamicForm.invalid">
        {{ data.submitButtonText }}
    </button>
</mat-dialog-actions>
