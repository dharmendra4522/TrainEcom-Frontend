<h2 mat-dialog-title class="fw-bold text-primary">{{ title }}</h2>

<mat-dialog-content [formGroup]="form" class="d-flex flex-column gap-3 pt-2">
  <p class="text-muted small">Please provide a reason or message for this action:</p>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Reason / Message</mat-label>
    <textarea 
      matInput 
      formControlName="message" 
      rows="3" 
      placeholder="Enter reason here..."
      (blur)="onBlurTrim()">
    </textarea>
    <mat-error *ngIf="form.get('message')?.invalid && (form.get('message')?.dirty || form.get('message')?.touched)">
      {{ getErrorMessage() }}
    </mat-error>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end" class="pb-3 px-3">
  <button mat-stroked-button color="warn" (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="onSubmit()">
    Submit
  </button>
</mat-dialog-actions>
