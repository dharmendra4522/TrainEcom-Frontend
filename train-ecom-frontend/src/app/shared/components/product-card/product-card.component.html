<mat-card class="product-card" appearance="outlined">
  <button mat-icon-button class="wishlist-btn" aria-label="Add to wishlist">
    <mat-icon>favorite_border</mat-icon>
  </button>

  <img
  mat-card-image
  [src]="product.thumbnailUrl"
  [alt]="product.name"
  loading="lazy"
  [routerLink]="['/products', product.id]"
  style="cursor: pointer;"
/>

  <mat-card-header [routerLink]="['/products', product.id]" style="cursor: pointer;">
    <mat-card-title>{{ product.name }}</mat-card-title>
    <mat-card-subtitle>{{ product.categoryName }} | {{ product.brandName }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>{{ product.description | slice: 0 : 50 }}...</p>
    <h2 style="color: #3f51b5; margin-top: 8px">
      {{ product.price | currency: "INR" }}
    </h2>
  </mat-card-content>

  <mat-card-actions style="display: flex; justify-content: space-between; padding: 16px">
    <button mat-raised-button color="accent" (click)="addToCart(product)">
      <mat-icon>add_shopping_cart</mat-icon> Add
    </button>
    <button mat-raised-button color="primary">Buy</button>
  </mat-card-actions>
</mat-card>
