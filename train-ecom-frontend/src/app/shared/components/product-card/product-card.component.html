<mat-card class="product-card" appearance="outlined" [routerLink]="['/products', product.id]" style="cursor: pointer;">
  <button mat-icon-button class="wishlist-btn" (click)="onToggleWishlist($event)"
    [matTooltip]="(isFavorite$ | async ) ? 'Remove from Wishlist' : 'Add to Wishlist'" *ngIf="isLoggedIn$ | async">
    <mat-icon [class.favorite-icon]="isFavorite$ | async">
      {{ (isFavorite$ | async) ? 'favorite' : 'favorite_border' }}
    </mat-icon>
  </button>

  <div
    class="image-container bg-light p-2 rounded-top d-flex align-items-center justify-content-center position-relative overflow-hidden">
    <img [src]="product.thumbnailUrl || 'assets/placeholder.jpg'" appImgFallback [alt]="product.name" loading="lazy"
      class="product-img" />
    <button class="hover-add-to-cart-btn d-flex align-items-center justify-content-center gap-1"
      *ngIf="product.stockQuantity && product.stockQuantity>0" (click)="addToCart(product); $event.stopPropagation()">
      <mat-icon style="font-size: 18px; width: 18px; height: 18px;">add_shopping_cart</mat-icon>
      <span>Add to Cart</span>
    </button>
  </div>

  <mat-card-header class="custom-card-header">
    <mat-card-title class="product-title" [title]="product.name">{{ product.name }}</mat-card-title>
    <mat-card-subtitle class="product-subtitle" [title]="product.categoryName + ' | ' + product.brandName">
      {{ product.categoryName }} | {{ product.brandName }}
    </mat-card-subtitle>
  </mat-card-header>


  <mat-card-content>
    <p>{{ product.description | slice: 0 : 50 }}...</p>
    <span class="text-danger fw-bold" *ngIf="product.stockQuantity && product.stockQuantity < 5">
      Only {{ product.stockQuantity }} left!
    </span>
    <h5 style="color: #3f51b5; margin-top: 8px">
      {{ product.price | currency: "INR" }}
    </h5>
  </mat-card-content>

  <mat-card-actions (click)="$event.stopPropagation()">
    <ng-container *ngIf="product.stockQuantity && product.stockQuantity > 0; else outOfStockTemplate">

      <button mat-raised-button color="primary" class="buy-now-btn" (click)="buyNow()">Buy Now</button>
    </ng-container>
    <ng-template #outOfStockTemplate>
      <div class="w-100 text-center py-2 text-danger fw-bold bg-danger-subtle rounded-3">
        Out of Stock
      </div>
    </ng-template>
  </mat-card-actions>
</mat-card>
