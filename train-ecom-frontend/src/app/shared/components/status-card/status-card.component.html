<div class="container d-flex flex-column gap-3">
  <div class="timer-section">
    <div class="d-flex flex-column align-items-center gap-4">
      <h3 class="text-center">
        Your Application is Under Review! <br />Thank you for registration
      </h3>
    </div>
  </div>
  <div class="d-flex flex-column gap-3">
    <div
      class="card-section border rounded d-flex flex-column align-items-start px-4 py-2"
    >
      <ng-container
        *ngIf="(registrationId$ | async) || localRegistrationId as regId"
      >
        <h3>Application Reg: #{{ shortReg(regId) }}</h3>
      </ng-container>

      <p>
        Submitted Date:
        {{
          (submittedDate$ | async) || localSubmittedDate
            | date: "medium" : "Asia/Kolkata"
        }}
      </p>

      <p>Current Status: {{ (status$ | async) || localStatus }}</p>
    </div>
  </div>
</div>
