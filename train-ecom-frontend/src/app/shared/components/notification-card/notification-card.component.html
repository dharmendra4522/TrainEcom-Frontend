<div class="p-3 rounded-3 border bg-white position-relative transition-all notification-card"
  [class.border-primary]="!item.isRead"
  (click)="onClick()">

  <div class="d-flex align-items-start gap-3">
    <div
      class="rounded-circle d-flex align-items-center justify-content-center bg-light text-primary flex-shrink-0 notification-icon-wrapper">
      <mat-icon>notifications_active</mat-icon>
    </div>

    <div class="flex-grow-1 pe-4">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <span class="fw-semibold text-dark fs-7">{{ item.title }}</span>
        <span class="text-muted fs-8">{{ item.timestamp }}</span>
      </div>
      <p class="text-secondary mb-0 fs-7 text-wrap notification-message">
        {{ item.message }}
      </p>
    </div>
  </div>

  <!-- Unread Indicator Dot -->
  <span *ngIf="!item.isRead" class="bg-primary rounded-circle position-absolute unread-dot"></span>

  <!-- Remove Notification Button -->
  <button class="btn border-0 bg-transparent p-0 position-absolute top-0 end-0 mt-2 me-2 text-muted delete-btn"
    (click)="onRemove($event)" title="Remove">
    <mat-icon class="fs-6">close</mat-icon>
  </button>
</div>
