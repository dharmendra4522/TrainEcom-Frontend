<div class="sidebar-wrapper d-flex flex-column h-100">
  <div class="sidebar-header px-4 py-3 d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <div class="header-icon-box rounded-2 d-flex align-items-center justify-content-center">
        <mat-icon class="text-primary fs-5">{{ sidebarType === 'admin' ? 'admin_panel_settings' : 'manage_accounts' }}</mat-icon>
      </div>
      <h6 class="text-dark fw-bold m-0 title-text">{{ title }}</h6>
    </div>
  </div>

  <mat-divider class="border-light opacity-50"></mat-divider>

  <mat-nav-list class="custom-nav-list px-2 py-3 gap-1 d-flex flex-column flex-grow-1">
    <a mat-list-item 
       *ngFor="let item of menuItems" 
       [routerLink]="item.route" 
       routerLinkActive="active-link"
       class="rounded-3 px-3 py-2 text-decoration-none transition-all">
       
       <mat-icon matListItemIcon class="text-secondary menu-icon me-3">{{ item.icon }}</mat-icon>
       <span matListItemTitle class="fw-semibold text-dark">{{ item.label }}</span>
    </a>
  </mat-nav-list>

  <div class="sidebar-footer p-3 border-top bg-white">
    <button mat-flat-button color="warn" class="w-100 py-2 rounded-3 d-flex align-items-center justify-content-center gap-2 shadow-none logout-btn" (click)="onLogout()">
      <mat-icon class="m-0">logout</mat-icon>
      <span class="fw-semibold">Logout</span>
    </button>
  </div>
</div>
