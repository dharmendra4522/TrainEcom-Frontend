<div class="sidebar-header">
  <h3>{{ title }}</h3>
</div>

<mat-nav-list class="custom-nav-list">
  <a mat-list-item *ngFor="let item of menuItems" 
     [routerLink]="item.route" 
     routerLinkActive="active-link"> <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
    <div matListItemTitle>{{ item.label }}</div>
  </a>
</mat-nav-list>
