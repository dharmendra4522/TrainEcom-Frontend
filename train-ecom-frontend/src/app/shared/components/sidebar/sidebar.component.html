<div class="sidebar-wrapper d-flex flex-column h-100 bg-white">
  <div
    class="sidebar-header px-4 py-3 d-flex align-items-center justify-content-between border-bottom"
  >
    <div class="d-flex align-items-center gap-3">
      <div
        class="header-icon-box rounded-3 d-flex align-items-center justify-content-center bg-primary-subtle text-primary"
      >
        <mat-icon class="fs-5">{{
          sidebarType === "admin" ? "admin_panel_settings" : "manage_accounts"
        }}</mat-icon>
      </div>
      <div>
        <h6 class="text-dark fw-bold m-0 title-text">{{ title }}</h6>
        <span class="text-muted fs-8 text-uppercase fw-semibold tracking-wider"
          >Navigation</span
        >
      </div>
    </div>
  </div>

  <mat-nav-list
    class="custom-nav-list px-3 py-3 gap-1 d-flex flex-column flex-grow-1"
  >
    <a
      mat-list-item
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active-link"
      class="sidebar-nav-item rounded-3 px-3 text-decoration-none transition-all"
    >
      <mat-icon matListItemIcon class="text-secondary menu-icon me-3">{{
        item.icon
      }}</mat-icon>
      <span matListItemTitle class="fw-semibold text-dark fs-7">{{
        item.label
      }}</span>
    </a>
  </mat-nav-list>

  <div class="sidebar-footer p-3 border-top bg-white">
    <button
      mat-flat-button
      class="w-100 py-2 rounded-3 d-flex align-items-center justify-content-center gap-2 shadow-none logout-btn"
      (click)="onLogout()"
    >
      <mat-icon class="m-0 fs-5">logout</mat-icon>
      <span class="fw-semibold">Logout</span>
    </button>
  </div>
</div>
