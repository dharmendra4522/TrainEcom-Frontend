<ng-container *ngIf="{
    role: userRole$ | async,
    loggedIn: isLoggedIn$ | async,
    profile: userProfile$ | async,
  } as auth">
  <ng-container *ngIf="auth.role !== 'Admin'">
    <app-top-promo-bar></app-top-promo-bar>
  </ng-container>

  <mat-toolbar class="main-header border-bottom bg-white sticky-top shadow-xs">
    <button mat-icon-button *ngIf="showMenuButton" class="text-dark me-2 sidebar-toggle-btn"
      (click)="toggleSidebar.emit()" matTooltip="Toggle Menu">
      <mat-icon>menu</mat-icon>
    </button>


    <div class="logo-wrapper d-flex align-items-center me-3 cursor-pointer" routerLink="/">
      <span class="logo-text fw-bold fs-4 text-dark tracking-tight">
        Train<span class="text-primary">Ecom</span>
      </span>
    </div>

    <span class="spacer"></span>

    <div class="nav-links d-none d-lg-flex align-items-center gap-1 me-4" *ngIf="auth.role !== 'Admin'">
      <a mat-button routerLink="/" routerLinkActive="active-nav-link" [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item-btn text-dark fw-semibold px-3">
        Home
      </a>
      <a mat-button routerLink="/contact" routerLinkActive="active-nav-link"
        class="nav-item-btn text-dark fw-semibold px-3">
        Contact
      </a>
      <a mat-button routerLink="/about" routerLinkActive="active-nav-link"
        class="nav-item-btn text-dark fw-semibold px-3">
        About
      </a>
    </div>

    <span class="spacer d-none d-lg-block"></span>

    <div class="action-icons d-flex align-items-center gap-1 gap-md-2">


      <ng-container *ngIf="auth.role !== 'Admin'">
        <button mat-icon-button (click)="openWishlist.emit()" aria-label="Wishlist" class="text-dark icon-circle-btn"
          matTooltip="Wishlist" [matBadge]="wishlistCount" [matBadgeHidden]="wishlistCount === 0" matBadgeColor="warn"
          matBadgeSize="small" *ngIf="auth.loggedIn">
          <mat-icon>favorite_border</mat-icon>
        </button>

        <button mat-icon-button (click)="openCart.emit()" aria-label="View Cart" class="text-dark icon-circle-btn"
          matTooltip="Cart" [matBadge]="cartCount" [matBadgeHidden]="cartCount === 0" matBadgeColor="warn"
          matBadgeSize="small">
          <mat-icon>shopping_cart</mat-icon>
        </button>
      </ng-container>

      <ng-container *ngIf="!auth.loggedIn">
        <a mat-flat-button color="primary" routerLink="/login"
          class="login-btn d-none d-md-inline-flex align-items-center gap-1 rounded-pill px-4 ms-2 fw-semibold">
          <span>Login</span>
          <mat-icon class="fs-6">arrow_forward</mat-icon>
        </a>
        <button mat-icon-button routerLink="/login" class="text-dark d-md-none" matTooltip="Login">
          <mat-icon>login</mat-icon>
        </button>
      </ng-container>

      <ng-container *ngIf="auth.role === 'Admin'">
        <button mat-icon-button matTooltip="Notifications" class="text-dark icon-circle-btn"
          (click)="openNotification.emit()" aria-label="Notifications">
          <mat-icon>notifications_none</mat-icon>
        </button>
      </ng-container>

      <ng-container *ngIf="auth.loggedIn">
        <div
          class="user-greeting-pill d-none d-md-flex align-items-center gap-2 ps-3 pe-2 py-1 rounded-pill bg-light border cursor-pointer ms-2"
          [matMenuTriggerFor]="profileMenu">
          <span class="user-name fw-bold text-dark fs-7" *ngIf="auth.profile">
            {{ auth.profile.name }}
          </span>
          <div
            class="avatar-circle rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold fs-7">
            {{ (auth.profile?.name || 'U').charAt(0).toUpperCase() }}
          </div>
        </div>

        <button mat-icon-button [matMenuTriggerFor]="profileMenu" class="d-md-none text-dark" matTooltip="My Account">
          <mat-icon>account_circle</mat-icon>
        </button>

        <mat-menu #profileMenu="matMenu" class="custom-profile-menu rounded-3 shadow-lg">
          <div class="px-3 py-2 border-bottom" *ngIf="auth.profile">
            <div class="fw-bold text-dark fs-6">{{ auth.profile.name }}</div>
            <div class="text-muted fs-7 text-truncate" style="max-width: 180px;">{{ auth.profile.email }}</div>
          </div>
          <a mat-menu-item routerLink="/account" class="py-2">
            <mat-icon class="text-primary me-2">manage_accounts</mat-icon>
            <span class="fw-medium">Manage Account</span>
          </a>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="onLogout()" class="text-danger py-2">
            <mat-icon class="text-danger me-2">logout</mat-icon>
            <span class="fw-medium">Logout</span>
          </button>
        </mat-menu>
      </ng-container>
    </div>
  </mat-toolbar>
</ng-container>
