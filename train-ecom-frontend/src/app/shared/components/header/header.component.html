<mat-toolbar color="primary" class="header-toolbar">
    <span class="logo-container" routerLink="/home">
        <mat-icon class="logo-icon">menu</mat-icon>
        <span class="logo-text">TrainEcom</span>
    </span>


    <div class="nav-links">
        <button mat-button routerLink="/home" routerLinkActive="active-link">
            <mat-icon>home</mat-icon> Home
        </button>

        <ng-container *ngIf="!isUserLoggedIn">
            <button mat-button routerLink="/auth" routerLinkActive="active-link">
                <mat-icon>login</mat-icon> Login
            </button>

            <button mat-raised-button color="accent" routerLink="/auth/register" routerLinkActive="active-link">
                <mat-icon>person_add</mat-icon> Register
            </button>
        </ng-container>

        <ng-container *ngIf="isUserLoggedIn">
            <button mat-button (click)="onLogout()">
                <mat-icon>logout</mat-icon> Logout
            </button>
        </ng-container>
    </div>
</mat-toolbar>
