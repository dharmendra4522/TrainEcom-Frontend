<mat-toolbar color="primary" class="header-toolbar">
    <span class="logo-container" routerLink="/home">
        <span class="logo-text">TrainEcom</span>
    </span>


    <div class="nav-links">
        <button mat-button routerLink="/home" class="hide-on-mobile">
            <mat-icon>home</mat-icon> Home
        </button>

        <button mat-icon-button routerLink="/cart" aria-label="Cart">
            <mat-icon matBadge="0" matBadgeColor="accent">shopping_cart</mat-icon>
        </button>

        <ng-container *ngIf="!(isLoggedIn$ | async)">
            <button mat-button routerLink="/login" class="hide-on-mobile">
                <mat-icon>login</mat-icon> Login
            </button>
            <button mat-raised-button color="accent" routerLink="/register" class="auth-btn">
                <mat-icon>person_add</mat-icon> Register
            </button>
        </ng-container>

        <ng-container *ngIf="isLoggedIn$ | async">
            <button mat-button (click)="onLogout()">
                <mat-icon>logout</mat-icon> Logout
            </button>
        </ng-container>
    </div>
</mat-toolbar>
