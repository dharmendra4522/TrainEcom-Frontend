<div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-2 px-4 pt-4 position-relative">
  <mat-progress-bar mode="indeterminate" *ngIf="isLoading$ | async" class="position-absolute bottom-0 start-0 w-100" style="height: 3px;"></mat-progress-bar>
  <h2 mat-dialog-title class="fw-bold m-0 p-0 border-0">Manage {{ entityTitle }}</h2>
  <button mat-icon-button mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="px-4 pb-2 custom-scrollbar" (scroll)="onScroll($event)">
  <table mat-table [dataSource]="(items$ | async) || []" class="w-100">
    
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef class="fw-bold text-secondary"> Name </th>
      <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="text-end pe-3 fw-bold text-secondary"> Actions </th>
      <td mat-cell *matCellDef="let element" class="text-end pe-0">
        <button mat-icon-button color="primary" (click)="onEdit(element)" matTooltip="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDelete(element.id)" matTooltip="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="bg-light-subtle"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell text-center py-4 text-muted" colspan="2">No {{ entityTitle | lowercase }} found.</td>
    </tr>
  </table>
</mat-dialog-content>

<mat-dialog-actions class="px-4 pb-4 pt-2 mb-0 border-top">
  <button mat-button color="primary" (click)="onAdd()" class="fw-bold d-flex align-items-center gap-1">
    <mat-icon>add</mat-icon> Add {{ data.type }}
  </button>
</mat-dialog-actions>
