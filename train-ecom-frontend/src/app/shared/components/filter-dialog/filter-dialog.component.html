<h2 mat-dialog-title>Filters</h2>

<mat-dialog-content>
  <form [formGroup]="filterForm" class="mb-4 px-2">
    <div class="d-flex flex-column align-items-start gap-2 w-100">
      <div class="d-flex flex-column align-items-start w-100">
        <label class="text-dark">Select Year</label>
        <mat-form-field
          appearance="outline"
          class="year-select-field flex-grow-1 w-100"
          subscriptSizing="dynamic"
        >
          <mat-select
            formControlName="year"
            placeholder="Select a year"
            aria-label="Select a year"
          >
            <mat-option>
              <ngx-mat-select-search
                [formControl]="yearFilterForm"
                placeholderLabel="Search year..."
                noEntriesFoundLabel="No matching years found"
              >
              </ngx-mat-select-search>
            </mat-option>

            <mat-option
              *ngFor="let year of filteredYear | async"
              [value]="year"
            >
              {{ year }}
            </mat-option>
          </mat-select>
          <button
            mat-icon-button
            matSuffix
            type="button"
            aria-label="Clear selected year"
            (click)="clearYearSelection()"
          >
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </div>
      <!-- Date range selection -->
      <div class="d-flex flex-column align-items-start w-100">
        <label class="text-dark">From Date</label>
        <mat-form-field
          appearance="outline"
          class="date-field flex-grow-1 w-100"
          subscriptSizing="dynamic"
        >
          <input
            matInput
            [matDatepicker]="fromPicker"
            formControlName="fromDate"
          />
          <button
            *ngIf="filterForm.controls.fromDate.value"
            mat-icon-button
            matSuffix
            type="button"
            aria-label="Clear from date"
            (click)="clearFromDate()"
          >
            <mat-icon>close</mat-icon>
          </button>
          <mat-datepicker-toggle matSuffix [for]="fromPicker">
          </mat-datepicker-toggle>
          <mat-datepicker #fromPicker></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="d-flex flex-column align-items-start w-100">
        <label class="text-dark">To Date</label>
        <mat-form-field
          appearance="outline"
          class="date-field flex-grow-1 w-100"
          subscriptSizing="dynamic"
        >
          <input matInput [matDatepicker]="toPicker" formControlName="toDate" />
          <button
            *ngIf="filterForm.controls.toDate.value"
            mat-icon-button
            matSuffix
            type="button"
            aria-label="Clear to date"
            (click)="clearToDate()"
          >
            <mat-icon>close</mat-icon>
          </button>
          <mat-datepicker-toggle matSuffix [for]="toPicker">
          </mat-datepicker-toggle>
          <mat-datepicker #toPicker></mat-datepicker>
        </mat-form-field>
      </div>

      <!-- vendor selection -->
      <div
        class="d-flex flex-column align-items-start w-100"
        *ngIf="!data.isVendor"
      >
        <label class="text-dark">Select vendors</label>
        <mat-form-field
          appearance="outline"
          class="year-select-field flex-grow-1 w-100"
          subscriptSizing="dynamic"
        >
          <mat-select
            formControlName="vendors"
            placeholder="Select vendors"
            aria-label="Select vendors"
            multiple
          >
            <mat-option>
              <ngx-mat-select-search
                [formControl]="vendorFilterForm"
                placeholderLabel="Search vendors..."
                noEntriesFoundLabel="No matching vendors found"
              >
              </ngx-mat-select-search>
            </mat-option>

            <mat-option
              *ngFor="let vendor of filteredVendors | async"
              [value]="vendor.id"
            >
              {{ vendor.name }}
            </mat-option>
          </mat-select>
          <button
            mat-icon-button
            matSuffix
            type="button"
            aria-label="Clear selected vendors"
            (click)="clearVendorSelection()"
          >
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="clearFilter()">Clear All</button>
  <button mat-button (click)="closeDialog()">Cancel</button>
  <button mat-raised-button color="primary" (click)="applyFilter()">
    Apply
  </button>
</mat-dialog-actions>
