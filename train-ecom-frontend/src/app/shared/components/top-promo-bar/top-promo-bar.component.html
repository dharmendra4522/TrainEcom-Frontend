<mat-toolbar *ngIf="isVisible" class="top-promo-toolbar">
    
    <span class="spacer"></span> 
    
    <span class="promo-text">
        Summer Sale For All Swim Suits And Free Express Delivery - OFF 50%! 
        <a routerLink="/home" class="shop-now-link">ShopNow</a>
    </span>

    <span class="spacer"></span> 

    <button mat-icon-button (click)="closePromo()" aria-label="Close Promo" class="close-btn">
        <mat-icon>close</mat-icon>
    </button>

</mat-toolbar>
