<mat-toolbar *ngIf="isVisible" class="top-promo-toolbar">

    <span class="spacer"></span>

    <span class="promo-text">
        "Summer Sale For All Electronics & Smart Gadgets — Free Express Delivery & Flat 50% OFF!"
        <a routerLink="/products" class="shop-now-link">ShopNow</a>
    </span>

    <span class="spacer"></span>

    <button mat-icon-button (click)="closePromo()" aria-label="Close Promo" class="close-btn">
        <mat-icon>close</mat-icon>
    </button>

</mat-toolbar>
