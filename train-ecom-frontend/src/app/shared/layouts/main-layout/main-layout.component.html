<div class="layout-wrapper">
  <app-side-panel #wishlistPanel type="WishList"></app-side-panel>
  <app-side-panel #cartPanel type="Cart"></app-side-panel>
  <app-side-panel #notificationPanel type="Notification"></app-side-panel>

  <app-header
    [showMenuButton]="shouldShowSidebar(userRole$ | async)"
    (toggleSidebar)="toggleDrawer()"
    (openWishlist)="wishlistPanel.open()"
    (openCart)="cartPanel.open()"
    (openNotification)="notificationPanel.open()"
  >
  </app-header>

  <app-product-filter
    *ngIf="
      (userRole$ | async) !== 'Admin' &&
      (userRole$ | async) !== 'Vendor' &&
      !isAccountRoute &&
      !isDetailsOrFormRoute
    "
    class="d-block"
  ></app-product-filter>

  <mat-sidenav-container
    class="main-container"
    [class.account-container]="isAccountRoute"
  >
    <mat-sidenav
      #drawer
      *ngIf="shouldShowSidebar(userRole$ | async)"
      [mode]="(isMobile$ | async) ? 'over' : 'side'"
      [opened]="isSidebarOpened"
      (openedChange)="isSidebarOpened = $event"
      [class.admin-sidebar]="(userRole$ | async) === 'Admin'"
      [class.vendor-sidebar]="(userRole$ | async) === 'Vendor'"
      [class.customer-sidebar]="(userRole$ | async) === 'Customer'"
    >
      <app-sidebar
        [title]="getSidebarTitle(userRole$ | async)"
        [menuItems]="(menuItems$ | async) || []"
        [sidebarType]="getSidebarType(userRole$ | async)"
      >
      </app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <div class="content-wrapper">
        <div
          class="page-padding flex-grow-area"
          [class.admin-page-padding]="(userRole$ | async) === 'Admin' || (userRole$ | async) === 'Vendor'"
          [class.customer-page-padding]="(userRole$ | async) === 'Customer'"
        >
          <router-outlet></router-outlet>
        </div>
         <app-footer *ngIf="(userRole$ | async) !== 'Admin' && (userRole$ | async) !== 'Vendor' && !isAccountRoute"></app-footer>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
