<div class="layout-wrapper">
  <div *ngIf="loadingService.loading$ | async" class="global-loader-overlay">
    <mat-spinner diameter="50"></mat-spinner>
  </div>

  <app-side-panel #wishlistPanel type="WishList"></app-side-panel>
  <app-side-panel #cartPanel type="Cart"></app-side-panel>
  <app-header [showMenuButton]="shouldShowSidebar(userRole$ | async) ? true : false" (toggleSidebar)="toggleDrawer()"
    (openWishlist)="wishlistPanel.open()" (openCart)="cartPanel.open()">
  </app-header>

  <mat-sidenav-container class="main-container">
    <mat-sidenav #drawer *ngIf="shouldShowSidebar(userRole$ | async)" [mode]="(isMobile$ | async) ? 'over' : 'side'"
      [opened]="isSidebarOpened" (openedChange)="isSidebarOpened = $event"
      [class.admin-sidebar]="(userRole$ | async) === 'Admin'"
      [class.customer-sidebar]="(userRole$ | async) === 'Customer'">
      <app-sidebar [title]="
          (userRole$ | async) === 'Admin' ? 'Admin Panel' : 'Manage My Account'
        " [menuItems]="
          (userRole$ | async) === 'Admin' ? adminMenuItems : consumerMenuItems
        " [sidebarType]="(userRole$ | async) === 'Admin' ? 'admin' : 'customer'">
      </app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <div class="content-wrapper">
        <div class="page-padding flex-grow-area">
          <router-outlet></router-outlet>
        </div>
        <app-footer *ngIf="(userRole$ | async) !== 'Admin'" [ngClass]=""></app-footer>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
